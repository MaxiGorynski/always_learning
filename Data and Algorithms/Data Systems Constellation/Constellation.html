const NODES = [
 ["btree","B-Tree","storage","The data structure behind almost every database index. Without an index, finding one row means scanning the whole table. A B-tree keeps keys sorted in a shallow, wide tree of disk pages, so the database can find any key, or any range of keys, by reading just three or four pages, even across billions of rows. It’s the default index in Postgres, MySQL and most relational databases."],
 ["lsm","LSM Tree","storage","A storage design built for heavy write traffic. Instead of finding each record on disk and updating it in place (slow, random I/O), an LSM tree collects writes in memory and periodically writes them out as sorted files that are never modified again. Writes become fast sequential appends; the trade-off is that a read may have to check several files. It powers Cassandra, RocksDB and other write-heavy stores."],
 ["wal","Write-Ahead Logging","storage","How databases avoid losing data when they crash. Before changing the actual data files, the database first appends a record of the change to a log on disk. If the power cuts out halfway through an update, the database replays the log on restart and finishes or undoes the work. This is what makes ‘committed’ mean durable, and the same log is reused for replication and backups."],
 ["bloom","Bloom Filter","storage","A tiny, memory-cheap structure that answers one question: ‘could this item be in the set?’ It replies either ‘definitely not’ or ‘probably yes’, and is only ever wrong in the ‘yes’ direction. Databases use it to avoid expensive disk reads for keys that don’t exist: if the filter says no, the file is skipped entirely."],
 ["compaction","Compaction","storage","Background housekeeping for LSM-tree databases. Because those databases never overwrite data in place, every update or delete leaves the old version behind in an older file. Compaction periodically merges files, keeps only the newest version of each key, and throws away deleted data. Without it, disk usage would grow forever and reads would slow down as they search more and more files."],
 ["vacuum","Database Vacuuming","storage","Garbage collection for databases like Postgres. When you update or delete a row, Postgres doesn’t erase the old version straight away, because transactions already in progress might still need to see it. Vacuuming later removes those dead versions and frees their space for reuse. If it falls behind, tables bloat, queries slow down, and in extreme cases the database stops accepting writes to protect itself."],
 ["wamp","Write Amplification","storage","The gap between how much data your application asks to write and how much the database actually writes to disk. Change a 100-byte row and the database may rewrite the whole 8 KB page that holds it, record the change again in the write-ahead log, and rewrite it once more during background maintenance. That multiplier, often 10× to 100×, eats disk bandwidth and wears out SSDs, and it is one of the main trade-offs between storage engines."],
 ["checkpoint","Checkpointing","storage","A periodic save point for a database. Changes are first recorded in the write-ahead log and held in memory, and only written to the main data files later. A checkpoint forces all of those pending changes out to the data files and marks the spot in the log. After a crash, the database only replays the log from the last checkpoint rather than from the beginning, so recovery is fast."],
 ["columnar","Columnar Storage","storage","Storing a table column by column instead of row by row. Analytics queries such as ‘average order value last year’ read one or two columns across millions of rows. A columnar store reads only those columns and skips the rest, and because a column holds similar values it compresses extremely well. That’s why data warehouses are columnar, while apps that fetch whole records use row stores."],
 ["secidx","Secondary Index","storage","An extra index on a column other than the primary key, so you can find rows by something besides their ID. A users table is organised by user_id, but logins search by email; an index on email turns that into a fast lookup instead of a full table scan. The cost is that every insert or update must also update each index, so more indexes mean slower writes and more storage."],
 ["ios","Index-Only Scan","storage","A query the database can answer entirely from an index, without visiting the table at all. Normally an index tells the database where a row lives, and it then fetches the row from the table. If the index already contains every column the query needs (a ‘covering’ index), that second trip is skipped, which can make the query several times faster."],
 ["pitr","Backups vs. Point-in-Time Recovery","storage","Two different ways to get data back. A backup is a full copy taken at one moment, so restoring it loses everything written since. Point-in-time recovery (PITR) combines a backup with the continuous log of every change made after it, so you can restore to any exact second, such as one second before someone ran DELETE without a WHERE clause."],

 ["acid","ACID Properties","txn","The four guarantees a database transaction gives you. Atomicity: all of its changes happen, or none do. Consistency: rules like ‘a balance can’t go negative’ hold before and after. Isolation: concurrent transactions don’t trip over each other’s half-finished work. Durability: once committed, data survives crashes. Together they let you write correct code without reasoning about every possible failure."],
 ["mvcc","MVCC","txn","The technique most databases use so that reads and writes don’t block each other. Instead of overwriting a row, the database keeps the old version and adds a new one. Each transaction sees the versions that were committed when it started, so a long-running report reads a stable picture while other users keep writing. The cost is cleaning up old versions later."],
 ["si","Snapshot Isolation","txn","An isolation level where every transaction works from a frozen picture of the database as it was when the transaction began. You never see others’ half-finished changes, and reading the same data twice always gives the same answer. Many databases default to it because it’s fast and intuitive, but it still allows one subtle bug: write skew."],
 ["serial","Serializability","txn","The strongest isolation level. The database guarantees the result is the same as if transactions had run one at a time, in some order, with no overlap. Every concurrency anomaly disappears, so you can reason about each transaction as if it were alone. The price is lower throughput, and transactions that sometimes get aborted and must be retried."],
 ["dirty","Dirty Read","txn","Reading data that another transaction has written but not yet committed. If that transaction then rolls back, you’ve made a decision based on data that never officially existed. It’s the weakest possible guarantee, and almost every database prevents it by default, so you’ll mostly meet it as the first rung on the ladder of isolation levels."],
 ["rskew","Read Skew","txn","When a transaction reads related pieces of data at slightly different moments and sees a combination that never actually existed. Each value it read was real and committed, but another transaction changed things between the reads. The classic case is checking two bank accounts during a transfer and seeing money missing or duplicated. Snapshot isolation prevents it."],
 ["wskew","Write Skew","txn","A sneaky concurrency bug. Two transactions read the same data, each makes a decision based on it, and each writes to a different row. Neither overwrites the other, so the database sees no conflict, yet together they break a rule that each on its own would have kept. It slips past snapshot isolation and needs serializable isolation or explicit locks."],
 ["phantom","Phantom Read","txn","When a transaction runs the same search twice and the second time new rows appear, or rows vanish, because another transaction inserted or deleted matching rows in between. Locking existing rows can’t prevent it, because the new rows didn’t exist yet to be locked. It matters for checks like ‘is this time slot free?’ just before booking it."],
 ["optlock","Optimistic Locking","txn","A strategy for concurrent updates that assumes conflicts are rare. Instead of locking a record while you work on it, you note its version number, and when you save you tell the database ‘only update if the version hasn’t changed’. If someone else changed it first, your update fails and you retry. There’s no waiting and no deadlock, but many retries if conflicts become common."],
 ["pesslock","Pessimistic Locking","txn","A strategy for concurrent updates that assumes conflicts are likely. You lock the record before reading or changing it, and anyone else who wants it waits until you finish. Nobody can change the data underneath you, which suits contested resources like seats or stock, but waiting transactions reduce throughput and can deadlock."],
 ["deadlock","Deadlock","txn","When two or more transactions are each waiting for a lock the other holds, so none of them can ever proceed. A holds row 1 and wants row 2; B holds row 2 and wants row 1. Databases detect the cycle and kill one transaction so the other can finish, so your application must be ready to retry the one that was killed."],
 ["escalation","Lock Escalation","txn","When a database decides it is tracking too many small locks and replaces them with one big lock. Locking 10,000 individual rows uses a lot of memory, so the database (notably SQL Server) may lock the whole table instead. That saves memory but blocks everyone else who wanted any row in the table, causing surprise slowdowns and deadlocks."],

 ["dtx","Distributed Transactions","consensus","A transaction that must change data in more than one database or service and still be all-or-nothing. On a single database this is easy. Across machines, any of them, or the network between them, can fail midway, leaving one side committed and the other not. Protocols like two-phase commit and patterns like sagas exist to handle this."],
 ["2pc","Two-Phase Commit (2PC)","consensus","The classic protocol for committing one transaction across several machines. A coordinator first asks every participant ‘can you commit?’, and each prepares and votes. Only if all vote yes does the coordinator tell them to commit. It guarantees all-or-nothing, but if the coordinator crashes after the vote, participants are stuck holding locks until it comes back."],
 ["3pc","Three-Phase Commit (3PC)","consensus","An attempt to fix two-phase commit’s main flaw: getting stuck when the coordinator crashes. It adds an extra round so participants know enough to finish on their own after a timeout. In theory that removes the blocking. In practice it relies on network delays being predictable, which real networks don’t guarantee, so it is rarely used."],
 ["saga","Saga Pattern","consensus","A way to run a multi-step business transaction across services without locking everything at once. Each step is a normal local transaction that commits immediately. If a later step fails, the saga runs compensating steps that undo the earlier ones, like a refund that reverses a charge. You give up instant all-or-nothing, but every service stays independent and available."],
 ["generals","Two Generals Problem","consensus","A classic thought experiment proving that two parties talking over an unreliable network can never be 100% sure they agree. Any message might be lost, so every confirmation needs its own confirmation, forever. It’s why distributed systems rely on timeouts, retries and idempotency instead of perfect certainty."],
 ["raft","Raft Consensus","consensus","A consensus algorithm: a way for a group of servers to agree on the same sequence of changes even when some of them crash. The servers elect one leader, the leader sends every change to the others, and a change counts as committed once a majority have stored it. It was designed to be easier to understand than Paxos, and runs inside etcd, Consul and CockroachDB."],
 ["election","Leader Election","consensus","How a group of servers picks exactly one of them to be in charge. Many systems are far simpler when a single node, the leader, makes decisions. The hard part is guaranteeing there’s never more than one leader at a time, even when the network is flaky, and choosing a new one quickly when the current leader dies."],
 ["quorum","Quorum","consensus","The minimum number of servers that must take part in an operation for it to count. If data lives on 3 servers, and writes must reach 2 and reads must ask 2, every read overlaps the latest write on at least one server. Quorums let a system keep working while a minority of servers is down, without returning stale data."],
 ["split","Split-Brain","consensus","When a network failure splits a cluster in two and each half believes it’s in charge. Both sides accept writes, so the data diverges and the conflicts can’t be cleanly merged later. It’s one of the most damaging failures in distributed databases, and is prevented by requiring a majority vote (a quorum) before any node can act as leader."],
 ["dlock","Distributed Locking","consensus","A lock shared by processes on different machines, so only one of them does something at a time, such as running a scheduled job. It’s much harder than a local lock: the holder can crash, pause, or lose its network connection while still believing it holds the lock. Safe versions use expiring leases and fencing tokens that reject writes from a stale holder."],
 ["idem","Idempotency","consensus","An operation is idempotent if doing it twice has the same effect as doing it once. Setting a value to 5 is idempotent; adding 5 isn’t. Networks force you to retry requests when you can’t tell whether they succeeded, and idempotency is what makes those retries safe, for example so a payment isn’t charged twice."],
 ["eos","Exactly-Once Semantics","consensus","The guarantee that each message is processed exactly once, never lost and never duplicated. Networks can’t actually deliver that: you either risk losing messages or risk sending some twice. So exactly-once systems deliver at least once and then discard duplicates, or make processing idempotent, so the effect is as if each message arrived once."],

 ["cap","CAP Theorem","repl","A rule about distributed databases. When the network between servers breaks (a partition), you must choose between consistency, where every read sees the latest write and some requests get refused, and availability, where every request gets an answer that might be out of date. You can’t have both during a partition, and that choice frames every replicated database."],
 ["strong","Strong Consistency","repl","The guarantee that once a write is confirmed, every later read, from anywhere, sees it. The system behaves as if there were just one copy of the data. It’s the easiest model to program against, but keeping replicas in lockstep needs coordination between servers, which adds latency and can reduce availability."],
 ["eventual","Eventual Consistency","repl","The guarantee that if writes stop, every replica will eventually hold the same data. Until then, different readers may see different, possibly outdated, values. It keeps systems fast and available, even across regions and network failures, at the cost of occasional stale reads that your application has to tolerate."],
 ["creads","Consistent Reads","repl","A practical middle ground between strong and eventual consistency: specific promises about what a reader will see. The most useful are read-your-writes (you always see your own changes) and monotonic reads (data never appears to go back in time). They fix the most confusing user-facing symptoms of replica lag without the full cost of strong consistency."],
 ["lf","Leader–Follower Replication","repl","The most common replication setup. One server, the leader, accepts all writes and records them in a log. The others, followers, copy that log and apply the same changes, so each holds a full copy of the data. Followers can serve reads and take over if the leader dies. Postgres, MySQL and MongoDB all work this way by default."],
 ["ml","Multi-Leader Replication","repl","A replication setup where more than one server accepts writes, each passing its changes to the others. Each region or data centre can write locally for low latency and keep working if another site is cut off. The catch: two leaders can change the same record at the same moment, and those conflicts have to be detected and resolved."],
 ["replicas","Read Replicas","repl","Extra copies of a database that only serve reads. All writes still go to the primary, which streams its changes to the replicas. Most apps read far more than they write, so sending reads to replicas multiplies read capacity. The catch is lag: a replica can be slightly behind, so a user might not see a change they just made."],
 ["physrep","Physical Replication","repl","Replicating a database by copying the exact low-level changes to its storage files, byte for byte. The replica becomes an identical clone of the primary, which makes it simple and dependable for failover. The limits: both servers must run the same database version, and you can’t replicate only some tables or send the data to a different kind of system."],
 ["logrep","Logical Replication","repl","Replicating a database by sending a stream of row-level changes, such as ‘insert this row’ or ‘update that column’, instead of raw storage bytes. Because it describes changes logically, you can replicate just some tables, replicate between different database versions, or feed the changes into another system entirely. It’s also the foundation of change data capture."],
 ["geo","Geo-Replication","repl","Keeping copies of your data in several geographic regions. Users read from a nearby copy, so responses are faster, and if a whole region goes down the others carry on. The hard part is writes: keeping regions in sync means either waiting on slow cross-region round trips, or accepting that regions briefly disagree."],
 ["rrepair","Read Repair","repl","Fixing out-of-date replicas as a side effect of reading. When a read asks several replicas for a value and notices one returned an older version, the system sends the newest version back to that replica. Data that is read often heals itself over time, which keeps leaderless databases like Cassandra converging."],
 ["cdc","Change Data Capture","repl","Streaming every insert, update and delete from a database to other systems as it happens. Instead of other services polling the database, or the app writing to two places, CDC reads the database’s own change log and publishes each change as an event. It’s how search indexes, caches, warehouses and other services stay in sync with the source of truth."],
 ["failover","Failover","repl","Automatically switching to a backup server when the primary fails. The system notices the primary has stopped responding, promotes a replica to be the new primary, and redirects traffic to it. Done well, it takes seconds. Done badly, it loses recent writes or leaves two servers both believing they’re in charge."],
 ["ha","High Availability","repl","Designing a system to keep running when parts of it fail. That means no single point of failure: redundant servers, replicated data, health checks and automatic failover. Availability is measured in ‘nines’: 99.9% allows almost 9 hours of downtime a year, and 99.99% allows under an hour."],

 ["hscale","Horizontal Scaling","part","Handling more load by adding machines rather than buying a bigger one. A single server has a ceiling and is a single point of failure; ten servers sharing the load can keep growing and survive one dying. It’s easy for stateless app servers behind a load balancer, and much harder for databases, which need sharding or replication."],
 ["sharding","Database Sharding","part","Splitting one large database into smaller, independent pieces called shards, each on its own server and holding a subset of the rows. A shard key, such as user ID, decides which shard each row lives on. Sharding lets data and write traffic grow beyond one machine, but queries that span shards get harder, and choosing the key well is critical."],
 ["hashpart","Hash Partitioning","part","Deciding which partition a record belongs to by hashing its key and using the result to pick a partition. A good hash spreads keys evenly, so no partition gets overloaded. The trade-off is that hashing scrambles key order, so a query over a range of keys, such as all of last week’s orders, has to ask every partition."],
 ["rangepart","Range Partitioning","part","Deciding which partition a record belongs to by key range: A–F on one server, G–M on the next, and so on. Keys stay in order, so a range query like ‘all events between 9 and 10am’ hits one or two partitions. The risk is hotspots: if the keys are timestamps, every new write lands in the newest range on a single server."],
 ["chash","Consistent Hashing","part","A way of assigning keys to servers so that adding or removing a server moves only a small fraction of the data. Keys and servers are both placed on a circle by their hash, and each key belongs to the next server round the circle. With naive ‘hash mod N’, changing N reshuffles nearly every key; consistent hashing moves only about 1/N of them."],
 ["hot","Hot Partition","part","A partition that gets far more traffic than the others, so it becomes the bottleneck while the rest of the cluster sits idle. It usually comes from one popular key, like a celebrity’s profile, or a key pattern that concentrates writes, like timestamps. Adding servers doesn’t help, because the load is stuck on that one partition."],
 ["dskew","Data Skew","part","When data isn’t spread evenly across keys or partitions, so some hold far more than others. Real data is usually lopsided: a few customers, countries or products dominate. Skew causes overloaded partitions, parallel jobs where one task runs for hours while the rest finish in minutes, and query plans built on wrong assumptions."],
 ["reshard","Resharding","part","Changing how data is split across shards on a running system, for example going from 4 shards to 16 as data grows. Rows must move between servers while the application keeps reading and writing them, with no data lost and minimal downtime. It’s one of the riskiest operations in a sharded system, so good designs make it rare or cheap."],
 ["rebalance","Rebalancing","part","Moving partitions between servers so each carries a fair share of data and traffic. It’s needed when servers are added or removed, or when some partitions grow faster than others. A good rebalancing scheme moves as little data as possible and keeps serving requests while the move happens."],
 ["federation","Federation","part","Splitting databases by function instead of by rows: one database for users, another for orders, another for products, often each owned by a different service. Each database is smaller and can be tuned and scaled independently. The cost is that queries and transactions spanning several of them must be stitched together in application code."],
 ["locality","Data Locality","part","Keeping data close to where it’s used. That means storing records that are read together in the same place (the same partition or row), and running computation on the machine that already holds the data instead of shipping it across the network. Network hops are expensive, so good locality makes queries and jobs dramatically faster."],

 ["lb","Load Balancing","traffic","Spreading incoming requests across several servers so none is overwhelmed. The load balancer sits in front, picks a healthy server for each request (in turn, or whichever is least busy), and stops sending traffic to servers that fail health checks. It’s what makes horizontal scaling and zero-downtime deploys possible."],
 ["cache","Caching","traffic","Keeping copies of frequently used data somewhere faster, such as memory or Redis, so you don’t fetch or compute it from the slow source every time. A good cache cuts database load and response times dramatically. The hard part is keeping cached data fresh when the source changes; stale data and stampedes when entries expire are the classic problems."],
 ["ratelimit","Rate Limiting","traffic","Capping how many requests a client can make in a time window, such as 100 per minute per API key. Requests over the limit are rejected, usually with HTTP 429, instead of being processed. It protects a service from abuse, stops one noisy customer starving the rest, and keeps traffic spikes from overwhelming it."],
 ["backpressure","Backpressure","traffic","A way for a slow part of a system to tell a faster part to slow down. Without it, a producer sending work faster than the consumer can handle fills queues until memory runs out or delays become enormous. With backpressure, the producer is made to wait, buffer a bounded amount, or drop work, so the system degrades gracefully."],
 ["breaker","Circuit Breaker","traffic","A wrapper around calls to another service that stops calling it when it’s clearly failing. After too many errors the breaker ‘opens’, and requests fail instantly instead of waiting on timeouts. After a cool-down it lets one test request through to check whether the service has recovered. It stops one failing dependency dragging down everything that calls it."],
 ["retrystorm","Retry Storm","traffic","When a struggling service makes its callers retry, and the retries add so much extra load that the service can never recover. If several layers each retry three times, one failed request can turn into dozens. Exponential backoff, random jitter and retry limits are the standard defences."],
 ["herd","Thundering Herd","traffic","When a large number of clients all do the same expensive thing at the same instant. The classic case is a popular cache entry expiring: thousands of requests miss the cache at once and hit the database together. It also happens after restarts, or with timers that fire at the same moment on every machine."],
 ["pool","Connection Pooling","traffic","Keeping a set of open database connections ready for reuse, instead of opening a new one for every request. Opening a connection is slow (network handshakes, authentication) and each one uses memory on the database server. A pool lends a connection to each request and takes it back afterwards, keeping both latency and the database’s connection count under control."],
 ["mux","Connection Multiplexing","traffic","Sending many independent requests over a single network connection at the same time, with each request tagged so its response can be matched up. It avoids the cost of opening many connections and stops one slow request blocking the ones behind it. HTTP/2 and gRPC both work this way."],
 ["leaks","Database Connection Leaks","traffic","A bug where code borrows a database connection from the pool and never gives it back, usually because an error skipped the cleanup step. Each leak permanently removes one connection from the pool. Eventually the pool is empty, every new request waits for a connection that never comes, and the app stops responding, even though the database is barely busy."],

 ["norm","Normalization","model","Designing tables so each fact is stored in exactly one place. A customer’s address lives in the customers table, and orders refer to the customer by ID instead of copying the address. An update then happens once and can’t leave contradictory copies behind. The trade-off is that reads often need joins to reassemble the data."],
 ["denorm","Denormalization","model","Deliberately storing the same data in more than one place so reads are faster. Rather than joining three tables on every page load, you copy the fields you need into the table you read from. Reads get simpler and quicker; writes get harder, because every copy must be updated and copies can drift out of sync."],
 ["mview","Materialized Views","model","A saved copy of a query’s result, stored like a table. Instead of re-running an expensive aggregation on every request, the database computes it once and serves the stored result instantly. The catch is freshness: the view only reflects the data as of its last refresh."],
 ["readmodel","Denormalized Read Models","model","Separate copies of data shaped specifically for how they’ll be read, kept apart from the data used for writes. Writes go to a clean, normalized model, and changes then flow into one or more read-optimised views, such as a single pre-built document per dashboard. This split is the core idea of CQRS (Command Query Responsibility Segregation)."],
 ["es","Event Sourcing","model","Storing every change to your data as an event in an append-only log, instead of storing only the current state. A bank account becomes its list of deposits and withdrawals, and the balance is calculated by replaying them. You get a complete audit history and can rebuild the state at any moment, at the cost of more complex reads and careful event versioning."],
 ["schema","Schema Evolution","model","Changing the shape of your data over time (adding fields, renaming columns, changing types) without breaking anything that still uses the old shape. In real systems, old and new versions of code, messages and stored data coexist for a while. Changes therefore need to be backward and forward compatible, usually by adding optional fields rather than changing or removing existing ones."],
 ["dw","Data Warehouse","model","A separate database built for analysing large amounts of historical data rather than serving an app’s day-to-day requests. Data is copied in from many operational systems and organised for big questions like ‘revenue by region by month for five years’. Keeping analytics here means heavy reports never slow down production."],
 ["planner","Query Planner","model","The part of the database that decides how to run your SQL. The same query can be executed many ways: which index to use, which table to read first, how to join them. The planner weighs the options and picks one. Running EXPLAIN shows its choice, and it’s the first thing to check when a query is slow."],
 ["cbo","Cost-Based Query Optimization","model","How most query planners choose between execution plans: estimate the cost of each and pick the cheapest. The estimates come from statistics the database keeps about your data, such as row counts and how values are distributed. When those statistics are stale, or the data is unusual, the estimates go wrong and the database picks a slow plan."]
];
// d = in depth · ex = example inside software · an = analogy from everyday life
const DETAILS = {
 // storage
 btree:{d:"High fan-out (hundreds of keys per page) keeps the tree 3–4 levels deep, so any key is a few page reads away. Leaves are sorted and linked, which makes range scans cheap.",
  ex:"Postgres’s default index: `CREATE INDEX ON orders(customer_id)` builds a B-tree, so `WHERE customer_id = 42` reads about three pages instead of scanning millions of rows.",
  an:"A library’s signposts: floor, then aisle, then shelf. Three hops reach any book, and the books on each shelf are in order."},
 lsm:{d:"Writes land in an in-memory memtable (plus a log). When it fills, it is flushed as an immutable sorted SSTable. Reads may check several SSTables, so compaction and bloom filters keep them fast.",
  ex:"Cassandra, RocksDB and ScyllaDB absorb hundreds of thousands of writes per second because every write is a sequential append, never an in-place update.",
  an:"Dropping letters in an in-tray instead of filing each one. Once a day you sort the tray and merge it into the filing cabinet."},
 wal:{d:"Sequential appends are fast and durable, so data pages can be written lazily later. On restart the database replays the log from the last checkpoint. The same log also feeds replication.",
  ex:"Postgres writes every change to `pg_wal` and fsyncs it on COMMIT. If the server loses power, it replays the WAL on restart and no committed transaction is lost.",
  an:"A chef calling each order out before cooking it. If the kitchen is interrupted, the list of called orders says exactly what still needs doing."},
 bloom:{d:"A bit array plus k hash functions. Adding an item sets k bits; checking tests them. False positives are tunable (about 1% at 10 bits per key); false negatives never happen. Items can’t be removed.",
  ex:"RocksDB checks each SSTable’s bloom filter before reading it, so a lookup for a missing key usually touches no disk at all.",
  an:"A doorman holding only guests’ initials. If yours aren’t on it, you’re definitely not invited; if they are, he checks the full list."},
 compaction:{d:"LSM trees accumulate overlapping files, stale versions and tombstones. Compaction merge-sorts them into fewer files. Size-tiered and leveled strategies trade write cost against read and space cost.",
  ex:"Cassandra’s leveled compaction keeps each key in at most one SSTable per level, so reads touch few files, at the cost of rewriting data more often.",
  an:"Combining a dozen half-filled notebooks into one clean binder, dropping every page you crossed out."},
 vacuum:{d:"Under MVCC, UPDATE and DELETE leave old row versions behind. Vacuum marks their space reusable, updates the visibility map and freezes old transaction IDs. Autovacuum runs it in the background.",
  ex:"A Postgres table updated 10 million times a day can bloat to several times its live size if autovacuum falls behind. `VACUUM (VERBOSE) orders` reports the dead tuples it removed.",
  an:"Clearing tables in a busy restaurant. The diners have gone, but nobody else can sit there until the plates are cleared."},
 wamp:{d:"Measured as bytes written to disk divided by bytes the application wrote. High amplification wears out SSDs and eats I/O bandwidth. B-trees amplify through page rewrites, LSM trees through repeated compaction.",
  ex:"Updating a 100-byte row in an 8 KB Postgres page writes the page, the WAL record, and possibly a full-page image after a checkpoint: often 100× amplification.",
  an:"Fixing one typo in a printed book by reprinting the whole chapter."},
 checkpoint:{d:"A checkpoint writes every dirty in-memory page to the data files and records a log position. Recovery replays only WAL after that point. More frequent checkpoints mean faster recovery but more I/O.",
  ex:"Postgres’s `checkpoint_timeout` (default 5 min) and `max_wal_size` decide how often it flushes, which bounds crash-recovery time.",
  an:"Saving a game at the start of each level, so dying only costs you the current level."},
 columnar:{d:"Analytical queries touch few columns across many rows. Storing columns separately means reading only those columns, and similar values compress well. Row stores remain better for fetching whole records.",
  ex:"`SELECT avg(price) FROM sales` over a billion-row Parquet table in BigQuery reads only the price column: a few GB instead of hundreds.",
  an:"Totting up a receipt pile by reading only the ‘total’ line of each, instead of every item."},
 secidx:{d:"Each entry maps a column value to a row’s location or primary key. Lookups and sorts on that column get fast, but every write must also update every index on the table.",
  ex:"`CREATE INDEX idx_users_email ON users(email)` makes login-by-email fast, at the cost of extra work on every signup.",
  an:"A cookbook’s ingredient index. Recipes are ordered by chapter, but the index finds every recipe that uses lemon."},
 ios:{d:"If every column a query needs is in the index (a covering index), the table is skipped entirely. In Postgres the visibility map must also show the pages as all-visible.",
  ex:"With an index on `(customer_id, created_at)`, `SELECT created_at FROM orders WHERE customer_id = 42` reads only the index.",
  an:"Answering ‘which page is lemon tart on?’ from the index alone, without turning to the recipe."},
 pitr:{d:"A backup alone restores to the moment it was taken. PITR combines a base backup with continuously archived WAL, so you can restore to any second, such as just before a bad DELETE.",
  ex:"Someone runs `DELETE FROM users` at 14:03. Restore last night’s base backup and replay WAL with `recovery_target_time = '14:02:59'`.",
  an:"A photo versus a video. The photo shows one moment; the video lets you rewind to any frame."},
 // transactions
 acid:{d:"Atomicity: all or nothing. Consistency: constraints hold before and after. Isolation: concurrent transactions don’t see each other’s partial work. Durability: committed data survives crashes.",
  ex:"A bank transfer debits A and credits B in one transaction. A crash between the two writes rolls both back.",
  an:"Completing a house sale. The money and the keys change hands together, or the deal doesn’t happen."},
 mvcc:{d:"Each write creates a new row version tagged with the writing transaction’s ID. Readers pick the version visible to their snapshot. Old versions are garbage-collected later by vacuum.",
  ex:"In Postgres, a long report query reads a consistent view of `orders` while hundreds of inserts commit alongside it. Neither waits on the other.",
  an:"Google Docs version history. You can read yesterday’s version while others keep editing today’s."},
 si:{d:"Reads come from the snapshot; conflicting writes to the same row are rejected at commit (first committer wins). Prevents dirty reads, non-repeatable reads and read skew, but still allows write skew.",
  ex:"Postgres REPEATABLE READ and Oracle’s SERIALIZABLE level are both snapshot isolation in practice.",
  an:"Photographing the shop shelves and planning your shopping from the photo while stock keeps changing."},
 serial:{d:"Implemented by literally running one at a time (VoltDB), two-phase locking, or serializable snapshot isolation that detects dangerous conflicts and aborts. Correct by construction; costs throughput and retries.",
  ex:"Postgres SERIALIZABLE aborts one of two conflicting transactions with `could not serialize access`, and the app must retry it.",
  an:"A single-occupancy changing room. Nobody’s turn can overlap, so nothing gets mixed up."},
 dirty:{d:"If the other transaction rolls back, you acted on data that never existed. Only READ UNCOMMITTED allows it, and most databases prevent it by default.",
  ex:"Txn A sets a balance to 0 but hasn’t committed. Txn B reads 0 and declines a payment. A rolls back, so B’s decision was based on a value that never existed.",
  an:"Reading a draft email over someone’s shoulder and acting on it, then watching them delete the draft."},
 rskew:{d:"Also called a non-repeatable read. Each value read was committed, but they come from different points in time, so invariants across them look broken.",
  ex:"Alice has £500 split across two accounts. Mid-transfer, her query reads account 1 before £100 leaves and account 2 after it arrives, and shows £600.",
  an:"Counting people in two rooms while someone walks between them, so they’re counted twice."},
 wskew:{d:"Neither transaction overwrites the other’s row, so row-level conflict checks miss it. Fix it with serializable isolation, by locking the rows you read, or with a constraint that captures the rule.",
  ex:"Rule: at least one doctor on call. Two on-call doctors each see that the other is on call, and both sign off. Nobody is left.",
  an:"Two flatmates each see milk in the fridge and each assume the other will buy more. Nobody does."},
 phantom:{d:"Row locks can’t lock rows that don’t exist yet. Preventing phantoms needs range or predicate locks (InnoDB’s next-key locks) or serializable isolation.",
  ex:"`SELECT count(*) FROM bookings WHERE room = 7 AND day = 'Mon'` returns 0. Another transaction inserts a booking. Re-running returns 1.",
  an:"Checking a meeting room is empty, turning to get your laptop, and finding someone has walked in."},
 optlock:{d:"Store a version or timestamp on each row and update with `WHERE version = :read_version`. Zero rows affected means someone else got there first. Best when conflicts are rare.",
  ex:"JPA’s `@Version`: `UPDATE item SET qty = 9, version = 4 WHERE id = 1 AND version = 3`. If no row updates, throw and retry.",
  an:"A wiki that warns you on save that someone else edited the page since you opened it."},
 pesslock:{d:"Acquire a row, range or table lock before touching data; conflicting transactions wait. Safe when conflicts are common, but it holds resources and risks deadlocks.",
  ex:"`SELECT * FROM seats WHERE id = 12 FOR UPDATE` holds the seat so no other booking can take it until you commit.",
  an:"Putting a ‘reserved’ sign on a restaurant table before you sit down."},
 deadlock:{d:"Databases find cycles in the wait-for graph and abort one victim. Prevent them by locking in a consistent order, keeping transactions short, and using lock timeouts.",
  ex:"Txn A locks row 1 then wants row 2; Txn B locks row 2 then wants row 1. Postgres reports `deadlock detected` and aborts one.",
  an:"Two cars meeting on a single-lane bridge, each waiting for the other to reverse."},
 escalation:{d:"Every lock costs memory. Past a threshold (about 5,000 locks per statement in SQL Server) the engine trades granularity for memory, which cuts concurrency.",
  ex:"A SQL Server batch updating 10,000 rows escalates to a table lock and blocks every other writer on that table.",
  an:"An usher who stops reserving seats one by one and ropes off the whole section."},
 // consensus
 dtx:{d:"Atomicity is easy on one node and hard across many, because any node or link can fail midway. The options are an atomic commit protocol (2PC), sagas, or designing so writes don’t span nodes.",
  ex:"Moving money between two banks’ databases: the debit at A and the credit at B must both happen or neither.",
  an:"Two people signing a contract by post from different cities. It isn’t binding until both signatures exist."},
 "2pc":{d:"Phase 1: each participant votes yes, durably promising it can commit, or no. Phase 2: the coordinator decides and tells everyone. After voting yes, a participant can’t decide alone.",
  ex:"An XA transaction spanning Postgres and a message broker. If the coordinator crashes after prepare, locks stay held until it recovers.",
  an:"A wedding. The officiant asks each person ‘do you?’ and only pronounces them married after two yeses."},
 "3pc":{d:"Adds a pre-commit step between voting and committing, so participants can time out and proceed safely if the coordinator dies. It assumes bounded network delay, which real networks don’t have.",
  ex:"Mostly a textbook protocol. Production systems prefer 2PC running on consensus groups (as Spanner does) or sagas.",
  an:"Confirming a plan in three rounds of texts, which still falls apart if a text arrives an hour late."},
 saga:{d:"Each step commits locally, then triggers the next. On failure, compensating actions undo earlier steps in reverse. There’s no global isolation, so others can see intermediate states.",
  ex:"Book a trip: flight, then hotel, then car. If the car fails, cancel the hotel, then cancel the flight.",
  an:"Booking a holiday piece by piece, and phoning to cancel earlier bookings if one part falls through."},
 generals:{d:"Any messenger can be lost, so every acknowledgement needs its own acknowledgement, forever. Real systems settle for practical certainty with timeouts, retries and idempotency.",
  ex:"A client sends a payment request and the connection drops. Did the server process it? The client can’t know without asking again.",
  an:"Two friends texting ‘see you at 8?’ on bad signal. Each confirmation needs its own confirmation."},
 raft:{d:"Nodes are leaders, followers or candidates. A leader is elected for a numbered term, appends entries, and commits them once a majority acknowledges. Equivalent to Paxos, designed to be understood.",
  ex:"etcd (the store behind Kubernetes), Consul and CockroachDB use Raft to keep replicated state consistent through node failures.",
  an:"A committee with an elected chair who keeps the minutes. A decision counts once most members hold a copy."},
 election:{d:"Elections need a majority so two leaders can’t share a term. Leaders hold leases or terms, and a stale leader must be fenced off from writing.",
  ex:"Kafka elects a controller through KRaft. If it dies, another node takes over within seconds.",
  an:"A team picking a captain by majority vote, and voting again if the captain is injured."},
 quorum:{d:"With N replicas, writes wait for W acknowledgements and reads query R nodes. If W + R > N, every read includes at least one node with the latest write. Tune W and R toward fast reads or fast writes.",
  ex:"Cassandra with N = 3 and QUORUM for both writes (W = 2) and reads (R = 2): 2 + 2 > 3, so reads see the latest write.",
  an:"Asking two of three witnesses. At least one of any two saw the most recent event."},
 split:{d:"Usually a network partition plus automatic failover without fencing. Both sides accept writes, and the conflicts are painful to reconcile. Prevent it with quorums and fencing (STONITH).",
  ex:"A two-node MySQL cluster loses its link. Each node promotes itself and takes orders. When they reconnect, they hold conflicting order IDs.",
  an:"Two people who each think they’re running the project, giving the team contradictory instructions."},
 dlock:{d:"Use a coordination service (etcd, ZooKeeper) with expiring leases. A paused client may still think it holds the lock, so the resource must check a monotonically increasing fencing token.",
  ex:"Only one worker may run the nightly billing job. It takes a lock in etcd with a 30-second lease and renews it while running.",
  an:"One key to the shared office kitchen that returns itself to the hook if its holder vanishes."},
 idem:{d:"Some operations are naturally idempotent (SET x = 5, DELETE id = 3). For the rest, use idempotency keys: the server stores each request ID and returns the saved result for duplicates.",
  ex:"Stripe’s `Idempotency-Key` header. Retrying a charge with the same key returns the original result instead of charging twice.",
  an:"Pressing a lift button five times. The lift still comes once."},
 eos:{d:"Networks can only deliver at-most-once or at-least-once. An exactly-once effect comes from deduplication, idempotent writes, or committing input offsets and output together in one transaction.",
  ex:"Kafka transactions commit consumer offsets and produced records atomically, so a crash and retry doesn’t double-count.",
  an:"A cashier who stamps each bill PAID. Hand it over twice and it’s still only paid once."},
 // replication
 cap:{d:"Partitions will happen, so the real choice is what to do during one: refuse requests (CP) or serve possibly stale data (AP). PACELC adds that, even without a partition, you trade latency against consistency.",
  ex:"ZooKeeper (CP) rejects writes on the minority side of a partition. DynamoDB in its default mode (AP) keeps serving, with eventual consistency.",
  an:"Two branches of a shop with the phone line down. Stop selling the last item (consistent) or keep selling and risk overselling (available)."},
 strong:{d:"Linearizability: the system behaves as if there is one copy, and each operation takes effect instantly at some point between its start and end. It needs coordination, which costs latency.",
  ex:"Spanner uses TrueTime and Paxos so that a read straight after a write, from any continent, sees that write.",
  an:"A single whiteboard everyone looks at. Once you write on it, everyone sees the same thing."},
 eventual:{d:"A weak guarantee: there’s no bound on how long convergence takes or on what you read meanwhile. Usually paired with conflict resolution (last-write-wins, CRDTs) and session guarantees.",
  ex:"You change your profile picture, and a friend in another region sees the old one for a few seconds.",
  an:"News spreading round a village. Everyone hears eventually, just not at the same moment."},
 creads:{d:"Session guarantees fill the gap between strong and eventual: read-your-writes, monotonic reads (never going back in time) and consistent prefix (seeing writes in order).",
  ex:"After you post a comment, the app reads from the leader for 10 seconds so you always see your own comment.",
  an:"Keeping a copy of a letter you posted, so you know what you wrote before it arrives."},
 lf:{d:"The leader orders every write and ships its log. Followers apply it synchronously (safer, slower) or asynchronously (faster, but recent writes can be lost on failover).",
  ex:"A Postgres primary streams WAL to two standbys. The app writes to the primary and can read from the standbys.",
  an:"A teacher writes on the board and the class copies it into their notebooks."},
 ml:{d:"Useful across regions and for offline clients. Concurrent writes to the same data conflict and need resolution: last-write-wins, merge functions or CRDTs.",
  ex:"CouchDB sync, or active-active MySQL across regions, where two users edit the same record in different places.",
  an:"Two editors each marking up their own printed copy, then reconciling their changes afterwards."},
 replicas:{d:"Add followers to scale reads. Replication is usually asynchronous, so replicas lag behind; their reads may be stale and can miss what you just wrote.",
  ex:"An online shop sends product browsing to five read replicas and checkouts to the primary.",
  an:"Photocopies of a popular library book. Many people can read at once, but corrections go into the original."},
 physrep:{d:"Replicates storage-level changes, so the replica is byte-identical: same major version, same schema, whole cluster only. Simple and fast, but it can’t filter or transform.",
  ex:"Postgres streaming replication to a hot standby that can take over on failover.",
  an:"Cloning a hard drive sector by sector."},
 logrep:{d:"Decodes the log into row-level inserts, updates and deletes and replays them. You can replicate only some tables, cross major versions, or feed other systems.",
  ex:"Using Postgres logical replication to upgrade from version 14 to 16 with near-zero downtime.",
  an:"Sending a list of edits (‘add row 7, change row 3’) instead of photocopying the pages."},
 geo:{d:"Data lives in several regions, giving local read latency and surviving a region outage. Synchronous cross-region writes add 70–150 ms; asynchronous ones risk losing recent writes.",
  ex:"DynamoDB Global Tables replicate one table across us-east-1 and eu-west-1, and each region reads and writes locally.",
  an:"Keeping copies of important documents in safe-deposit boxes in different cities."},
 rrepair:{d:"In leaderless stores, a read collects versions from several replicas, returns the newest and writes it back to any replica that was behind. Rarely-read data relies on background anti-entropy repair instead.",
  ex:"A Cassandra QUORUM read finds replica B holding an old value and updates it in the background.",
  an:"Comparing notes with a colleague, noticing their phone list is out of date, and handing them yours."},
 cdc:{d:"Reads the database’s own change log rather than polling tables, so every committed change is captured, in order, with low overhead. It enables event-driven pipelines without fragile dual writes.",
  ex:"Debezium reads MySQL’s binlog and publishes each row change to Kafka, keeping Elasticsearch in sync.",
  an:"Subscribing to a shop’s stock-change feed instead of walking the aisles to see what’s different."},
 failover:{d:"Detect the failure (heartbeats, timeouts), pick the most up-to-date replica, promote it, and redirect clients. Timeouts that are too short cause needless failovers; async replicas can lose recent writes.",
  ex:"AWS RDS Multi-AZ detects a dead primary and repoints the DNS endpoint at the standby in about a minute.",
  an:"The understudy going on stage when the lead actor falls ill."},
 ha:{d:"Remove single points of failure with redundancy, detect failures, and recover automatically. 99.9% uptime allows 8.8 hours of downtime a year; 99.99% allows 53 minutes.",
  ex:"Three app servers behind a load balancer, plus a database with automatic failover across availability zones.",
  an:"A hospital with backup generators. The lights stay on when the mains fail."},
 // partitioning
 hscale:{d:"Stateless tiers scale out easily; stateful ones such as databases need partitioning or replication. It removes the ceiling of the biggest machine, at the cost of distributed-systems complexity.",
  ex:"Going from 2 to 20 web servers behind a load balancer for Black Friday, then scaling back down.",
  an:"Hiring more cashiers instead of searching for one superhumanly fast cashier."},
 sharding:{d:"Each shard holds a subset of rows and is a complete database. The shard key decides placement, and should spread load evenly while keeping common queries on one shard.",
  ex:"Instagram shards by user ID, so each user’s photos and likes live together on one shard.",
  an:"Splitting a phone book into volumes A–F, G–M and so on, each kept by a different librarian."},
 hashpart:{d:"Partition = hash(key) mod N, or a hash range. Key order is lost, so range queries hit every partition. Plain mod N reshuffles almost every key when N changes, which is why consistent hashing exists.",
  ex:"DynamoDB hashes each item’s partition key to pick a storage partition, spreading user IDs evenly.",
  an:"Seating students by the last digit of their ID. The tables fill evenly, but friends end up apart."},
 rangepart:{d:"Each partition owns a contiguous slice of the sorted key space, and slices split as they grow. Range scans hit one or a few partitions, but ever-increasing keys hammer the last one.",
  ex:"HBase and CockroachDB split tables into key ranges, so scanning `user:1000` to `user:2000` touches one range.",
  an:"Encyclopedia volumes by letter. Finding everything from ‘Ca’ to ‘Ce’ is easy, but the ‘S’ volume gets thick."},
 chash:{d:"Hash both nodes and keys onto a circle; each key belongs to the next node clockwise. Virtual nodes (many points per server) smooth out the load.",
  ex:"Amazon’s Dynamo, Cassandra and memcached clients use rings, so adding a server moves only some of its neighbour’s keys.",
  an:"Guests round a table, each serving the dishes to their left. A new guest only takes over some of one neighbour’s dishes."},
 hot:{d:"Even with good hashing, one popular key concentrates traffic on one partition. Fixes: add a random suffix to the key, split the partition, cache in front, or redesign the key.",
  ex:"A celebrity’s post: millions of reads hit the one partition that holds that post’s ID.",
  an:"One checkout lane with a queue out the door while the others stand empty."},
 dskew:{d:"Some keys have far more rows than others, since power-law distributions are common. Skew unbalances storage, leaves one straggler task in parallel jobs, and misleads query planners.",
  ex:"A Spark join on `country` where 60% of rows are ‘US’: one executor does most of the work while the rest sit idle.",
  an:"Sorting the post by surname in a town where half the residents are called Smith."},
 reshard:{d:"Typically: choose a new layout, copy data in the background, dual-write or replay changes, then cut over. Pre-splitting into many small logical shards makes later moves cheaper.",
  ex:"Moving from 4 to 16 shards with Vitess, which copies and catches up data before switching traffic over.",
  an:"Moving house while still living in it: pack, ship, keep both addresses working, then redirect the post."},
 rebalance:{d:"When nodes join, leave or become uneven, partitions migrate between them. Good schemes move the minimum data and keep serving traffic during the move.",
  ex:"Adding a node to an Elasticsearch cluster triggers shard relocation until every node holds a similar share.",
  an:"Spreading books across the shelves after buying a new bookcase."},
 federation:{d:"Also called functional partitioning. Each database is smaller and tuned to its job, but cross-database joins and transactions move into the application.",
  ex:"Users in Postgres, the product catalogue in a document store, analytics in a warehouse, each owned by one service.",
  an:"A company where HR, finance and sales each keep their own records."},
 locality:{d:"Network hops dominate latency. Keep data that’s used together in the same partition or row, and send computation to the data rather than the other way round.",
  ex:"Hadoop schedules each map task on the node that already holds its HDFS block, avoiding a network transfer.",
  an:"Keeping cooking utensils by the hob instead of in the garage."},
 // traffic
 lb:{d:"Distributes work by round-robin, least connections, or hashing for stickiness. Health checks remove dead instances. Layer 4 balances connections; layer 7 balances individual requests.",
  ex:"An AWS Application Load Balancer spreads HTTPS requests across 10 containers and stops routing to any that fail health checks.",
  an:"A host seating guests across the waiters’ sections so no waiter is swamped."},
 cache:{d:"Common patterns are cache-aside, write-through and write-behind. Choose TTLs and invalidation rules carefully; stale data and stampedes on expiry are the main risks.",
  ex:"Cache-aside with Redis: look up `user:42`; on a miss, query Postgres and store the result with a 5-minute TTL.",
  an:"Keeping your most-used spices on the counter instead of in the cupboard."},
 ratelimit:{d:"Algorithms: token bucket (allows bursts), leaky bucket (smooths them), fixed or sliding windows. Rejected requests get 429 Too Many Requests, ideally with a Retry-After header.",
  ex:"GitHub’s API allows 5,000 requests per hour per token. Request 5,001 gets a 429.",
  an:"A club letting in 50 people an hour, however long the queue."},
 backpressure:{d:"Without it, a fast producer fills unbounded queues until memory or latency blows up. Mechanisms include bounded queues that block, credit or window schemes, and explicit ‘slow down’ signals.",
  ex:"TCP flow control. The receiver advertises a window size and the sender pauses when it fills.",
  an:"A dishwasher telling the waiters to stop bringing plates until the rack clears."},
 breaker:{d:"Three states: closed (normal), open (fail immediately after too many errors), half-open (let one test request through). Stops threads piling up while they wait on a dead service.",
  ex:"Resilience4j around a payment API: at 50% failures over 10 seconds it opens for 30 seconds and returns a fallback.",
  an:"A fuse box that cuts the power to protect the house, and is reset once the fault is fixed."},
 retrystorm:{d:"When every layer retries, failures multiply: 3 layers × 3 retries is 27× the load. Fix with exponential backoff, jitter, retry budgets, and retrying at only one layer.",
  ex:"A database slows down. Every service retries three times immediately, load triples, and the database falls over.",
  an:"Everyone redialling a jammed phone line at once, which keeps it jammed."},
 herd:{d:"Triggered by cache expiry, a restart, or a synchronised timer. Mitigate with request coalescing (single-flight), staggered TTLs, jitter, and a lock around recomputation.",
  ex:"The homepage cache key expires at midnight, and 10,000 requests all miss and run the same expensive query.",
  an:"Shop doors opening on Black Friday, with everyone rushing in at once."},
 pool:{d:"Opening a database connection costs TCP and TLS handshakes, authentication, and server memory (a whole process in Postgres). A pool caps connections and lends them out per request.",
  ex:"HikariCP with `maximumPoolSize=20` lets a Java app serve 2,000 requests a second over 20 Postgres connections.",
  an:"A taxi rank. Cars wait for passengers instead of being built for each journey."},
 mux:{d:"One connection carries many concurrent requests, each tagged with a stream ID. This avoids per-connection overhead and stops one slow request from blocking the others.",
  ex:"HTTP/2 and gRPC run dozens of concurrent calls over a single TCP connection.",
  an:"A coach carrying many passengers to the same city instead of each driving their own car."},
 leaks:{d:"Caused by code paths that skip `close()`, usually on an exception. The symptom is pool timeouts under load while the database itself is quiet. Fix with try-with-resources and leak-detection timeouts.",
  ex:"A request handler throws before `conn.close()`. After 20 such errors the pool is empty and every request hangs.",
  an:"Library books borrowed and never returned, until the shelves are bare."},
 // modeling
 norm:{d:"Normal forms (1NF, 2NF, 3NF, BCNF) progressively remove repeating groups and redundant dependencies. This prevents update anomalies, at the cost of more joins.",
  ex:"Store a customer’s address once in `customers` and reference it by `customer_id` from `orders`, instead of copying it into every order.",
  an:"Keeping one master contact list instead of writing friends’ addresses inside every birthday card."},
 denorm:{d:"Pre-join or copy fields where reads dominate. You then have to keep the copies in sync, through triggers, application code or event pipelines.",
  ex:"Storing `author_name` on each post so the feed query doesn’t need to join `users`.",
  an:"Writing a friend’s number on the fridge as well as in your phone: quicker to find, but two places to update."},
 mview:{d:"Unlike a plain view, the results are stored, so reads are fast. Refreshes are manual, scheduled or incremental, and data is stale between them.",
  ex:"`CREATE MATERIALIZED VIEW daily_sales AS SELECT day, sum(total) …`, refreshed hourly for a dashboard.",
  an:"A printed monthly sales report: quick to read, but only as fresh as its print date."},
 readmodel:{d:"In CQRS, writes go to a normalized model, and events or CDC update read models shaped for particular screens or queries. Reads are fast and simple; consistency is eventual.",
  ex:"Order events update an `order_summary` document in Elasticsearch, which the customer dashboard queries directly.",
  an:"A restaurant keeps a ledger of every order, and also a specials board written for diners."},
 es:{d:"Append events such as `ItemAdded` instead of overwriting state. You get a full audit trail, time travel, and new projections from old data. The costs are replay time (use snapshots) and careful schema handling.",
  ex:"A bank account stored as ‘Deposited £100’, ‘Withdrew £30’. The £70 balance is derived by replaying them.",
  an:"A chess game recorded as moves. Replay them to recreate the board at any point."},
 schema:{d:"Rules of thumb: add optional fields, never reuse field IDs, never change types. Backward compatible means new readers handle old data; forward compatible means old readers handle new data.",
  ex:"Adding an optional `phone` field to an Avro schema. Confluent Schema Registry rejects any change that breaks compatibility.",
  an:"Adding an optional box to a paper form. Old forms stay valid, and new ones carry more information."},
 dw:{d:"Data from many operational systems is loaded (ETL or ELT) into star or snowflake schemas for analysis. Columnar and massively parallel, and kept separate so reports don’t slow production.",
  ex:"Snowflake or BigQuery holding years of orders, users and marketing data for business dashboards.",
  an:"A national archive that gathers every office’s records so historians can study them in one place."},
 planner:{d:"Parses the query, generates candidate plans (scan types, join algorithms, join orders) and picks one. `EXPLAIN` shows the chosen plan; `EXPLAIN ANALYZE` runs it and shows real timings.",
  ex:"`EXPLAIN SELECT * FROM orders WHERE id = 5` shows `Index Scan using orders_pkey` rather than a sequential scan.",
  an:"A sat-nav choosing a route. Same destination, many possible roads."},
 cbo:{d:"Uses table statistics (row counts, histograms, distinct values) to estimate the rows and I/O of each plan. Stale or skewed statistics give bad estimates and slow plans, so run ANALYZE.",
  ex:"Postgres estimates a filter matches 10 rows and picks a nested loop. It actually matches a million, and the query takes minutes.",
  an:"Choosing a supermarket queue by counting baskets. It works only if your count is right."},
};

/* ---------- 3D force layout (seeded, computed once) ---------- */

  edges.forEach(e=>{const a=e.a,b=e.b;let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d=Math.hypot(dx,dy,dz)||1;const f=(d-95)*.02;
    dx/=d;dy/=d;dz/=d;a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f;b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f;});
  nodes.forEach(n=>{const c=centers[n.cl];n.vx+=(c[0]-n.x)*.012-n.x*.004;n.vy+=(c[1]-n.y)*.012-n.y*.004;n.vz+=(c[2]-n.z)*.012-n.z*.004;
    const m=Math.min(1,Math.hypot(n.vx,n.vy,n.vz))*0+1; n.x+=n.vx*.5*cool*m;n.y+=n.vy*.5*cool;n.z+=n.vz*.5*cool;n.vx*=.6;n.vy*=.6;n.vz*=.6;});
}
// recentre and normalise radius
{let mx=0,my=0,mz=0;nodes.forEach(n=>{mx+=n.x;my+=n.y;mz+=n.z});mx/=nodes.length;my/=nodes.length;mz/=nodes.length;

let cy=1,sy=0,cp=1,sp=0;

function focusSet(){

/* ---------- render ---------- */
let t0=performance.now();

  cy=Math.cos(cam.yaw);sy=Math.sin(cam.yaw);cp=Math.cos(cam.pitch);sp=Math.sin(cam.pitch);

  ctx.clearRect(0,0,W,H);

    if(focusEdge){hot.push(e);continue;}

/* ---------- picking ---------- */
function pickNode(mx,my){

}
function pickEdge(mx,my,th){
  let best=null,bd=th;
  for(const e of edges){const a=P[e.a.i],b=P[e.b.i];if(!a||!b||!a.ok||!b.ok)continue;
    const F=focusSet(); if(selected && !(e.a===selected||e.b===selected)) continue;
    const vx=b.x-a.x,vy=b.y-a.y,L=vx*vx+vy*vy||1;let t=((mx-a.x)*vx+(my-a.y)*vy)/L;t=Math.max(0,Math.min(1,t));

  zoomBy(Math.exp(Math.max(-1,Math.min(1,dy*.004))));},{passive:false});
canvas.addEventListener('dblclick',ev=>{if(!pickNode(ev.clientX,ev.clientY)) zoomBy(.6);});
addEventListener('keydown',ev=>{
  if(!quizEl.hidden) return;  // the quiz handles its own keys
  if(ev.target.tagName==='TEXTAREA') return;
  if(ev.key==='Escape'){clusterFocus=null;deselect();}
  if(ev.target.tagName==='INPUT') return;
  if(ev.key==='+'||ev.key==='=') zoomBy(.7);
  else if(ev.key==='-'||ev.key==='_') zoomBy(1/.7);
});
document.getElementById('zin').onclick=()=>zoomBy(.7);
document.getElementById('zout').onclick=()=>zoomBy(1/.7);
document.getElementById('zreset').onclick=()=>{clusterFocus=null;deselect();};

function select(n){selected=n;hoverNode=null;goal.c=[n.x,n.y,n.z];goal.dist=Math.min(goal.dist,640);renderNode(n,false);}
function deselect(){selected=null;if(clusterFocus){selectRegion(clusterFocus);return;}goal.c=[0,0,0];goal.dist=950;renderIntro();}
function selectRegion(k){
  clusterFocus=k;selected=null;hoverNode=null;
  const m=nodes.filter(n=>n.cl===k), c=[0,0,0];
  m.forEach(n=>{c[0]+=n.x/m.length;c[1]+=n.y/m.length;c[2]+=n.z/m.length;});
  const spread=Math.max(...m.map(n=>Math.hypot(n.x-c[0],n.y-c[1],n.z-c[2])));
  goal.c=c;goal.dist=clampD(spread*3.2+260);lastInteract=performance.now();
  renderRegion(k);
}
const renderHome=()=>clusterFocus?renderRegion(clusterFocus):renderIntro();

/* ---------- panel ---------- */
const panel=document.getElementById('panel');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
function facets(x){
  if(!x) return '';
  return `<section class="facet"><div class="eyebrow">In depth</div><p>${fmt(x.d)}</p></section>
    <section class="facet example"><div class="eyebrow">In practice</div><p>${fmt(x.ex)}</p></section>
    <section class="facet analogy"><div class="eyebrow">Think of it as</div><p>${fmt(x.an)}</p></section>`;
}
function renderNode(n,preview){

  panel.innerHTML=`

    <div class="eyebrow">Star chart</div>

function renderRegion(k){
  const C=CLUSTERS[k], R=REGIONS[k], m=nodes.filter(n=>n.cl===k).sort((a,b)=>b.links.length-a.links.length);
