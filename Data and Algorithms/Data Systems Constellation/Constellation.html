const q=document.getElementById('q'),res=document.getElementById('results');let active=0,matches=[];
function drawResults(){
  const v=q.value.trim().toLowerCase();
  if(!v){res.hidden=true;return;}
  matches=nodes.filter(n=>n.name.toLowerCase().includes(v)).slice(0,7);
  if(!matches.length){res.innerHTML=`<li><button disabled style="color:var(--mist);cursor:default">No concept matches “${esc(q.value)}”</button></li>`;res.hidden=false;return;}
  active=Math.min(active,matches.length-1);
  res.innerHTML=matches.map((n,i)=>`<li><button data-id="${n.id}" class="${i===active?'active':''}"><span class="dot" style="color:${CLUSTERS[n.cl].color}"></span>${esc(n.name)}</button></li>`).join('');
  res.hidden=false;
  res.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>pick(byId[b.dataset.id]));
}
function pick(n){select(n);q.value='';res.hidden=true;q.blur();}
q.addEventListener('input',()=>{active=0;drawResults();});
q.addEventListener('keydown',ev=>{
  if(ev.key==='ArrowDown'){active=Math.min(active+1,matches.length-1);drawResults();ev.preventDefault();}
  else if(ev.key==='ArrowUp'){active=Math.max(active-1,0);drawResults();ev.preventDefault();}
  else if(ev.key==='Enter'&&matches[active]){pick(matches[active]);}
  else if(ev.key==='Escape'){q.value='';res.hidden=true;}
});
q.addEventListener('blur',()=>setTimeout(()=>res.hidden=true,150));

/* ---------- storage: private per-viewer docs, browser fallback ---------- */
// Cloud mode keeps docs under data/users/<id>/ (private to the viewer); otherwise localStorage.
const store={mode:'local',db:null,uid:null,chain:{},
  ready:(async()=>{try{
    const c=window.claude; if(!c||!c.use) return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    const uid=user?await user.id():null;
    if(db&&uid){store.db=db;store.uid=uid;store.mode='cloud';}
  }catch(e){}})(),
  ref(k){return this.db.collection('data/users/'+this.uid).doc(k);},
  local(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('dsc:'+k)||'null');localStorage.setItem('dsc:'+k,JSON.stringify(v));}catch(e){return null;}},
  async get(k){await this.ready;
    if(this.mode==='cloud'){try{const s=await this.ref(k).get();return s.exists?JSON.parse(JSON.stringify(s.data())):null;}catch(e){}}
    return this.local(k);},
  set(k,v){const body=JSON.parse(JSON.stringify(v));
    const run=async()=>{await this.ready;
      if(this.mode==='cloud'){try{await this.ref(k).set(body);return;}catch(e){}}
      this.local(k,body);};
    return this.chain[k]=(this.chain[k]||Promise.resolve()).then(run,run);}  // one write at a time per doc
};

/* ---------- card conversations with Claude ---------- */
// key: "n-<nodeId>" for a concept card, "r-<regionKey>" for a region card
let sample=null, chatKey=null;
const chats={}, pending={}, drafts={};
let chatIndex={};  // key -> {n, last}: which cards have conversations
store.get('index').then(v=>{chatIndex=(v&&v.chats)||{};if(!selected&&!clusterFocus&&!hoverNode)renderIntro();});
window.claude?.use?.('sample').then(s=>{sample=s;syncComposer();}).catch(()=>{});

const TUTOR=`You are a patient tutor helping a software engineer learn data-systems concepts, in the clear, problem-first teaching style of Hello Interview. The learner is reading the card below and asking you about it. Explain plainly, define any jargon you use, prefer concrete examples, and connect to related concepts when it helps. Keep answers focused, usually under 200 words unless they ask for more depth. Write short paragraphs; you may use **bold**, \`code\` and "- " bullet lists, and no other formatting. If they ask you to quiz them, ask one question at a time and wait for their answer.\n\n`;
function cardContext(key){
  const [t,id]=[key[0],key.slice(2)];
  if(t==='n'){const n=byId[id],x=DETAILS[id];
    return `CARD: concept\nName: ${n.name}\nRegion: ${CLUSTERS[n.cl].name}\nSummary: ${n.def}\nIn depth: ${x.d}\nIn practice: ${x.ex}\nAnalogy: ${x.an}\nRelated concepts:\n`+n.links.map(e=>`- ${(e.a===n?e.b:e.a).name}: ${e.rel}`).join('\n');}
  const C=CLUSTERS[id],R=REGIONS[id];
  return `CARD: region\nName: ${C.name}\nAbout: ${R.about}\nWhy it matters at work:\n`+R.why.map(w=>'- '+w).join('\n')+'\nConcepts in this region:\n'+nodes.filter(n=>n.cl===id).map(n=>`- ${n.name}: ${n.def}`).join('\n');
}
function cardName(key){return key[0]==='n'?byId[key.slice(2)].name:CLUSTERS[key.slice(2)].name;}
const inlineMd=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function md(t){
  let html='',list=false;
  for(const line of esc(t).split('\n')){
    const m=line.match(/^\s*[-*•] +(.*)/);
    if(m){if(!list){html+='<ul>';list=true;}html+='<li>'+inlineMd(m[1])+'</li>';continue;}
    if(list){html+='</ul>';list=false;}
    if(line.trim()) html+='<p>'+inlineMd(line.replace(/^#+\s*/,''))+'</p>';
  }
  return html+(list?'</ul>':'');
}
const dayFmt=new Intl.DateTimeFormat(undefined,{day:'numeric',month:'short',year:'numeric'});
const timeFmt=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'});
async function loadChat(key){
  if(!chats[key]){const v=await store.get('chat-'+key);chats[key]=chats[key]||{turns:(v&&Array.isArray(v.turns))?v.turns:[]};}
  return chats[key];
}
function saveChat(key){
  const c=chats[key];
  while(c.turns.length>2&&JSON.stringify(c).length>200000) c.turns.splice(0,2); // stay well under the 256 KiB doc cap
  store.set('chat-'+key,{turns:c.turns});
  chatIndex[key]={n:c.turns.filter(t=>t.role==='user').length,last:Date.now()};
  store.set('index',{chats:chatIndex});
}
const STARTERS=['Explain it like I’m new to this','Give me another real-world example','How does this come up in a system design interview?','What mistakes do engineers make with this?','Quiz me on this'];
// Conversation display: one collapsible section; inside, one expandable item per question, newest first.
let chatCollapsed=store.local('chatCollapsed')===true;
const qaOpen={};  // key -> {itemIndex: bool}, the viewer's own open/closed choices
function chatItems(turns){
  const items=[];
  for(const t of turns){
    if(t.role==='user') items.push({q:t,a:[]});
    else if(items.length) items[items.length-1].a.push(t);
  }
  return items;
}
function renderChat(){
  const el=document.getElementById('chat'); if(!el||!chatKey) return;
  const key=chatKey,c=chats[key];
  if(!c){el.innerHTML='<div class="eyebrow">Your conversation</div><p class="empty-chat">Loading your history…</p>';return;}
  const p=pending[key], items=chatItems(c.turns), n=items.length;
  let html=`<button type="button" class="chat-head" id="chatToggle" aria-expanded="${!chatCollapsed}"><span class="eyebrow">Your conversation${n?` · ${n} question${n>1?'s':''}`:''}</span><span class="chev">${chatCollapsed?'Show':'Hide'}</span></button>`;
  if(!chatCollapsed){
    if(!n){
      html+=`<p class="empty-chat">Ask Claude anything about ${esc(cardName(key))}. Each question you ask is kept on this card with its answer and date, so you can come back and see how your understanding has grown.</p>`;
      if(sample) html+=`<ul class="starters">${STARTERS.map(s=>`<li><button type="button" data-q="${esc(s)}">${esc(s)}</button></li>`).join('')}</ul>`;
    } else {
      const open=qaOpen[key]||(qaOpen[key]={});
      html+='<div class="qa-list">';
      for(let i=n-1;i>=0;i--){
        const it=items[i], isOpen=(i in open)?open[i]:i===n-1, at=it.q.at||Date.now();
        const answer=it.a.length?it.a.map(t=>md(t.content)).join('')
          :(p&&i===n-1)?`<div id="pendingBody">${p.text?md(p.text):'<span class="thinking">Thinking…</span>'}</div>`
          :'<span class="thinking">No answer was saved for this question.</span>';
        html+=`<details class="qa" data-i="${i}"${isOpen?' open':''}><summary><span class="q">${esc(it.q.content)}</span><span class="when">${dayFmt.format(at)} · ${timeFmt.format(at)}</span></summary><div class="answer">${answer}</div></details>`;
      }
      html+='</div>';
    }
  }
  el.innerHTML=html;
  document.getElementById('chatToggle').onclick=()=>{chatCollapsed=!chatCollapsed;store.local('chatCollapsed',chatCollapsed);renderChat();};
  // record only the viewer's own clicks (the default-open newest item fires toggle too)
  el.querySelectorAll('.qa summary').forEach(sm=>sm.addEventListener('click',()=>{const d=sm.parentElement;(qaOpen[key]||(qaOpen[key]={}))[d.dataset.i]=!d.open;}));
  el.querySelectorAll('.starters button').forEach(b=>b.onclick=()=>ask(key,b.dataset.q));
}
function scrollToChat(){const el=document.getElementById('chat');if(el)panel.scrollTop=el.offsetTop-panel.offsetTop-8;}
const composer=document.getElementById('composer'),askBox=document.getElementById('askBox'),askBtn=document.getElementById('askBtn'),stopBtn=document.getElementById('stopBtn'),askStatus=document.getElementById('askStatus');
function syncComposer(){
  composer.hidden=!chatKey||!sample;
  if(!chatKey) return;
  const busy=!!pending[chatKey];
  askBtn.disabled=busy; stopBtn.hidden=!busy;
  askBox.placeholder=`Ask about ${cardName(chatKey)}…`;
  if(!askStatus.dataset.err) askStatus.textContent=busy?'Claude is answering…':(store.mode==='cloud'?'Saved privately to your account':'Saved in this browser');
  renderChat();
}
// Mount the conversation for a card (or null to hide it). Called by the panel renderers.
function mountChat(key){
  if(chatKey&&chatKey!==key) drafts[chatKey]=askBox.value;
  chatKey=key; askStatus.textContent=''; delete askStatus.dataset.err;
  if(key){askBox.value=drafts[key]||''; if(!chats[key]) loadChat(key).then(()=>{if(chatKey===key)renderChat();});}
  syncComposer();
}
const ERR={not_granted:'Claude wasn’t allowed for this page.',sampling_disabled:'Claude isn’t available on this account.',rate_limited:'Too many questions at once. Try again in a moment.',session_expired:'Sign in again to keep asking.',refused:'Claude declined that question. Try rephrasing it.',prompt_too_large:'This conversation is too long to send. Older turns will be trimmed next time.',empty_completion:'Claude returned nothing. Try rephrasing.',upstream_error:'The connection dropped. Ask again.'};
async function ask(key,question){
  question=question.trim(); if(!question||!sample||pending[key]) return;
  const c=await loadChat(key);
  const history=c.turns.slice(-30).map(t=>({role:t.role,content:t.content}));
  c.turns.push({role:'user',content:question,at:Date.now()}); saveChat(key);
  const ctl=new AbortController(); pending[key]={text:'',ctl};
  if(chatCollapsed){chatCollapsed=false;store.local('chatCollapsed',false);}
  if(chatKey===key){askBox.value='';drafts[key]='';askStatus.textContent='';delete askStatus.dataset.err;syncComposer();scrollToChat();}
  const input=[{role:'user',content:TUTOR+cardContext(key)},...history,{role:'user',content:question}];
  try{
    const r=await sample(input,{cache:false,signal:ctl.signal,onText:({text})=>{
      pending[key].text=text;
      const b=chatKey===key&&document.getElementById('pendingBody');
      if(b) b.innerHTML=md(text);
    }});
    c.turns.push({role:'assistant',content:r.text+(r.truncated?'\n\n(Answer cut short. Ask for the rest.)':''),at:Date.now()});
  }catch(e){
    if(e&&e.text) c.turns.push({role:'assistant',content:e.text+'\n\n(Interrupted.)',at:Date.now()});
    if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')) sample=null;
    if(e&&e.code!=='cancelled'&&chatKey===key){askStatus.textContent=ERR[e.code]||ERR.upstream_error;askStatus.dataset.err='1';}
  }finally{
    delete pending[key]; saveChat(key);
    if(chatKey===key) syncComposer();
  }
}
composer.addEventListener('submit',ev=>{ev.preventDefault();if(chatKey)ask(chatKey,askBox.value);});
askBox.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();composer.requestSubmit();}});
askBox.addEventListener('input',()=>{askBox.style.height='auto';askBox.style.height=Math.min(140,askBox.scrollHeight)+'px';});
stopBtn.onclick=()=>{if(chatKey&&pending[chatKey])pending[chatKey].ctl.abort();};

/* ---------- quiz: questions built from the cards ---------- */
// Other names a concept goes by in the card text, so the answer can be blanked out of its own question.
const ALIASES={
  btree:['B-tree'],lsm:['LSM tree','LSM'],wal:['write-ahead log','WAL'],bloom:['bloom filter','filter'],vacuum:['vacuuming','vacuum','autovacuum'],
  wamp:['amplification','amplify'],checkpoint:['checkpoint'],columnar:['columnar','column-wise'],secidx:['secondary index'],ios:['index-only scan'],
  pitr:['point-in-time recovery','PITR'],acid:['ACID'],si:['snapshot isolation'],serial:['serializable','serializability'],dirty:['dirty read'],
  rskew:['read skew'],wskew:['write skew','write-skew'],phantom:['phantom'],optlock:['optimistic locking'],pesslock:['pessimistic locking','pessimistic lock'],
  escalation:['escalation','escalates','escalate'],dtx:['distributed transaction'],'2pc':['two-phase commit','2PC'],'3pc':['three-phase commit','3PC'],
  saga:['saga'],generals:['Two Generals'],raft:['Raft'],election:['election'],quorum:['quorum'],split:['split-brain'],dlock:['distributed lock'],
  idem:['idempotent','idempotency'],eos:['exactly-once','exactly once'],eventual:['eventually','eventual consistency'],ml:['multi-leader'],
  lf:['leader–follower','single-leader'],replicas:['read replica','replica'],physrep:['physical replication'],logrep:['logical replication'],
  cdc:['CDC','change data capture'],ha:['availability','high availability'],hscale:['horizontally','scale out'],sharding:['sharding','shard'],
  dskew:['skew','skewed'],chash:['consistent hashing'],lb:['load balancer','load-balanced','load balancing'],cache:['cache','cached','caching'],
  ratelimit:['rate limit','rate limiting'],breaker:['circuit breaker','breaker'],retrystorm:['retry storm'],herd:['thundering herd'],
  pool:['connection pool','pool'],mux:['multiplexing','multiplexed'],leaks:['leak','leaked'],mview:['materialized view'],readmodel:['read model'],
  es:['event sourcing','event-sourced'],dw:['data warehouse','warehouse'],planner:['query planner','planner'],cbo:['cost-based'],denorm:['denormalization'],
  norm:['normalization'],rrepair:['read repair'],failover:['failover'],reshard:['resharding'],rebalance:['rebalancing']
};
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const BLANK='\u0000';
function nameVariants(n){
  const v=new Set([n.name,n.name.replace(/\s*\(.*?\)/g,'')]);
  const par=n.name.match(/\(([^)]+)\)/); if(par) v.add(par[1]);
  (ALIASES[n.id]||[]).forEach(x=>v.add(x));
  return [...v].filter(Boolean).sort((a,b)=>b.length-a.length);
}
function maskFor(text,n){
  let t=text;
  for(const v of nameVariants(n)) t=t.replace(new RegExp('(^|[^\\w])'+reEsc(v)+'(e?s)?(?![\\w])','gi'),(m,pre)=>pre+BLANK);
  return t;
}
const qHtml=t=>fmt(t).replace(/\u0000/g,'<mark>▢▢▢</mark>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const QTYPES=[
  {k:'def',label:'Which concept is this?',text:n=>n.def},
  {k:'an', label:'Which concept does this analogy describe?',text:n=>DETAILS[n.id].an,cls:'analogy'},
  {k:'ex', label:'Which concept is this an example of?',text:n=>DETAILS[n.id].ex},
  {k:'rel',label:'Which concept completes this relationship?'}
];
function makeQuestion(n,pool){
  const type=QTYPES[Math.floor(Math.random()*QTYPES.length)];
  let html,anchor=null;
  if(type.k==='rel'){
    const e=n.links[Math.floor(Math.random()*n.links.length)]; anchor=e.a===n?e.b:e.a;
    html=`<b>${esc(anchor.name)}</b> ↔ <mark>▢▢▢</mark><br>${qHtml(maskFor(e.rel,n))}`;
  } else html=qHtml(maskFor(type.text(n),n));
  // distractors: never the answer, never a neighbour of the relation's anchor; same region first (harder)
  const exclude=new Set([n]); if(anchor){exclude.add(anchor);anchor.links.forEach(e=>{exclude.add(e.a);exclude.add(e.b);});}
  let cands=pool.filter(x=>!exclude.has(x)); if(cands.length<3) cands=nodes.filter(x=>!exclude.has(x));
  const wrong=[...shuffle(cands.filter(x=>x.cl===n.cl)),...shuffle(cands.filter(x=>x.cl!==n.cl))].slice(0,3);
  return {answer:n,kind:type.label,cls:type.cls||'',html,options:shuffle([n,...wrong])};
}
// Open question: the learner writes a definition and Claude marks it.
function defineQuestion(n){
  return {answer:n,kind:'Define it in your own words',cls:'',html:`Define <b>${esc(n.name)}</b>.`,options:null};
}
// Weighted pick: unseen concepts and ones you miss come up more often.
function pickConcepts(pool,count,stats){
  const bag=pool.map(n=>{const [r,w]=stats[n.id]||[0,0];return {n,w:(r+w===0?3:1+3*w/(r+w))};});
  const out=[];
  while(out.length<count){
    if(!bag.length) bag.push(...pool.map(n=>({n,w:1})));
    let t=Math.random()*bag.reduce((s,b)=>s+b.w,0),i=0;
    for(;i<bag.length-1;i++){t-=bag[i].w;if(t<=0)break;}
    out.push(bag.splice(i,1)[0].n);
  }
  return out;
}

/* ---------- quiz: flow, scoring and progress ---------- */
// Stored as one private doc: stats = {conceptId: [right, wrong]}, attempts = [{at, scope, score, total}]
const quizEl=document.getElementById('quiz'),quizCard=document.getElementById('quizCard'),quizBtn=document.getElementById('quizBtn');
let quizData={stats:{},attempts:[]},quizLoaded=false,run=null,qScope='all',qLen=10;
store.get('quiz').then(v=>{
  if(v) quizData={stats:(v.stats&&typeof v.stats==='object')?v.stats:{},attempts:Array.isArray(v.attempts)?v.attempts:[],defs:(v.defs&&typeof v.defs==='object')?v.defs:{}};
  quizLoaded=true; if(!quizEl.hidden&&!run) renderQuizHome();
});
const scopeName=k=>k==='all'?'Whole network':CLUSTERS[k].name;
const pct=(r,t)=>t?Math.round(100*r/t):0;
const num=v=>String(Math.round(v*10)/10);  // half points from partly-right answers
function quizRecord(n){const s=quizData.stats[n.id];return s?`<div class="more">Quiz record: ${num(s[0])} of ${num(s[0]+s[1])} correct</div>`:'';}
const quizHead=t=>`<div class="quiz-head"><h2 id="quizTitle">${esc(t)}</h2><button class="x" data-act="close">Close</button></div>`;
function progressHtml(){
  if(!quizLoaded) return '<p class="intro">Loading your progress…</p>';
  const A=quizData.attempts,S=quizData.stats;
  if(!A.length&&!Object.keys(S).length) return `<div class="eyebrow">Your progress</div><p class="intro">No quizzes yet. Your scores, accuracy by region and the concepts worth revisiting will build up here as you play.</p>`;
  let right=0,total=0; Object.values(S).forEach(([r,w])=>{right+=r;total+=r+w;});
  const mastery=clusterKeys.map(k=>{
    const m=nodes.filter(n=>n.cl===k);let r=0,t=0,seen=0;
    m.forEach(n=>{const s=S[n.id];if(s){r+=s[0];t+=s[0]+s[1];seen++;}});
    return `<li><span>${esc(CLUSTERS[k].name)} <span style="color:var(--mist)">· ${seen}/${m.length} seen</span></span><span class="track"><i style="width:${pct(r,t)}%;background:${CLUSTERS[k].color}"></i></span><span class="pc">${t?pct(r,t)+'%':'—'}</span></li>`;}).join('');
  const recent=A.slice(-20);
  const weak=nodes.filter(n=>S[n.id]&&S[n.id][1]>0).map(n=>({n,r:S[n.id][0],t:S[n.id][0]+S[n.id][1]}))
    .sort((a,b)=>a.r/a.t-b.r/b.t||b.t-a.t).slice(0,5);
  return `<div class="eyebrow">Your progress</div>
    <div class="stats"><div><b>${A.length}</b><span>Quizzes</span></div><div><b>${num(total)}</b><span>Answers</span></div><div><b>${pct(right,total)}%</b><span>Accuracy</span></div></div>
    <div class="eyebrow">Accuracy by region</div><ul class="mastery">${mastery}</ul>
    ${recent.length?`<div class="eyebrow">Last ${recent.length} quiz${recent.length>1?'zes':''} · score %</div><div class="history">${recent.map(a=>`<i style="height:${Math.max(4,pct(a.score,a.total))}%" title="${dayFmt.format(a.at)} · ${esc(scopeName(a.scope))} · ${num(a.score)}/${a.total}"></i>`).join('')}</div>`:''}
    ${weak.length?`<div class="eyebrow">Concepts to revisit</div><ul class="weak">${weak.map(x=>`<li><button data-open="${x.n.id}">${esc(x.n.name)}<span>${num(x.r)}/${num(x.t)} right</span></button></li>`).join('')}</ul>`:''}`;
}
function renderQuizHome(){
  run=null;
  quizCard.innerHTML=quizHead('Pop quiz')+`
    <div class="eyebrow">Questions from</div>
    <div class="chips">${['all',...clusterKeys].map(k=>`<button data-scope="${k}" aria-pressed="${qScope===k}">${k==='all'?'':`<span class="dot" style="color:${CLUSTERS[k].color}"></span>`}${esc(scopeName(k))}</button>`).join('')}</div>
    <div class="eyebrow">Length</div>
    <div class="chips">${[5,10,20].map(n=>`<button data-len="${n}" aria-pressed="${qLen===n}">${n} questions</button>`).join('')}</div>
    <button class="go" data-act="start">Start quiz</button>
    ${progressHtml()}`;
}
function openQuiz(){
  qScope=clusterFocus||(selected&&selected.cl)||qScope;
  quizEl.hidden=false; renderQuizHome(); quizCard.querySelector('[data-act="start"]').focus();
}
function closeQuiz(){
  if(run&&!run.done) finishRun();
  quizEl.hidden=true; run=null; quizBtn.focus();
  if(selected) renderNode(selected,false);  // refresh the card's quiz record
}
function startRun(){
  const pool=qScope==='all'?nodes:nodes.filter(n=>n.cl===qScope);
  const maxDefine=sample?Math.ceil(qLen/4):0; let defines=0;
  const qs=pickConcepts(pool,qLen,quizData.stats).map(n=>
    (defines<maxDefine&&Math.random()<.2&&++defines)?defineQuestion(n):makeQuestion(n,pool));
  run={scope:qScope,qs,i:0,score:0,answered:0,missed:[],picked:null,done:false};
  renderQuestion();
}
function renderQuestion(){
  const q=run.qs[run.i];
  quizCard.innerHTML=quizHead(scopeName(run.scope))+`
    <div class="qmeta"><span>Question ${run.i+1} of ${run.qs.length}</span><span id="qScore">Score ${num(run.score)}</span></div>
    <div class="qbar"><i style="width:${100*run.i/run.qs.length}%"></i></div>
    <div class="qkind">${q.kind}</div>
    <p class="qtext ${q.cls}">${q.html}</p>
    ${q.options
      ?`<ul class="opts">${q.options.map((o,i)=>`<li><button data-opt="${i}"><span class="k">${i+1}</span>${esc(o.name)}</button></li>`).join('')}</ul>`
      :`<p class="defhint">What is it, what problem does it solve, and what does it cost? A few sentences is plenty.</p>
        <label for="defBox" class="eyebrow">Your answer</label>
        <textarea class="defbox" id="defBox" placeholder="In my own words…"></textarea>
        <div class="qactions" id="defActions"><button class="go" data-act="grade">Check my answer</button><button class="ghost" data-act="skip">Skip</button></div>`}
    <div id="qAfter"></div>`;
  quizCard.querySelector(q.options?'.opts button':'#defBox').focus();
}
// credit: 1 right, 0.5 partly right (open answers), 0 wrong
function record(q,credit){
  run.answered++; run.score+=credit;
  const st=(quizData.stats[q.answer.id]||[0,0]).slice();
  st[0]+=credit; st[1]+=1-credit; quizData.stats[q.answer.id]=st;
  if(credit<1) run.missed.push(q.answer);
  store.set('quiz',quizData);
}
function answer(i){
  const q=run.qs[run.i]; if(run.picked!==null||!q.options) return;
  run.picked=i;
  const ok=q.options[i]===q.answer;
  record(q,ok?1:0);
  quizCard.querySelectorAll('.opts button').forEach((b,j)=>{b.disabled=true;if(q.options[j]===q.answer)b.classList.add('right');else if(j===i)b.classList.add('wrong');});
  document.getElementById('qScore').textContent='Score '+num(run.score);
  const last=run.i===run.qs.length-1;
  document.getElementById('qAfter').innerHTML=`<div class="verdict ${ok?'':'miss'}"><b>${ok?'Correct':'Not quite · it’s '+esc(q.answer.name)}</b><p>${esc(q.answer.def)}</p></div>
    <div class="qactions"><button class="go" data-act="next">${last?'See results':'Next question'}</button><button class="ghost" data-open="${q.answer.id}">Open card</button></div>`;
  quizCard.querySelector('[data-act="next"]').focus();
}
const VERDICT={correct:{credit:1,label:'Correct',cls:''},partly:{credit:.5,label:'Partly right · half a point',cls:'partly'},incorrect:{credit:0,label:'Not quite',cls:'miss'}};
async function gradeDefinition(){
  const q=run&&run.qs[run.i]; if(!q||q.options||run.picked!==null||run.grading) return;
  const box=document.getElementById('defBox'),after=document.getElementById('qAfter'),acts=document.getElementById('defActions');
  const text=box.value.trim();
  if(text.split(/\s+/).filter(Boolean).length<4){after.innerHTML='<p class="marking" style="animation:none">Write at least a sentence so Claude has something to mark.</p>';box.focus();return;}
  if(!sample){after.innerHTML='<p class="intro">Claude isn’t available to mark answers in this view.</p>';return;}
  run.grading=true; box.disabled=true; acts.hidden=true;
  after.innerHTML='<p class="marking">Claude is marking your answer</p>';
  const n=q.answer,x=DETAILS[n.id];
  const prompt=`You are marking a software engineer's answer in a self-study quiz on data-systems concepts. They were asked to define "${n.name}" in their own words.

Reference material (for you only; the learner did not see it while answering):
Summary: ${n.def}
In depth: ${x.d}

The learner's answer:
"""${text.slice(0,4000)}"""

Judge understanding, not wording, spelling or length. Mark "correct" if they capture the core idea and what it is for. Mark "partly" if the core idea is there but with a significant gap or a misconception. Mark "incorrect" if the core idea is missing or wrong. Be fair and encouraging, and specific.

Reply with only this JSON object:
{"verdict": "correct" | "partly" | "incorrect", "feedback": "2-3 sentences addressed to the learner: what they got right, then what was missing or wrong", "missing": "the single most important point they missed, or an empty string"}`;
  try{
    const r=await sample.json(prompt);
    if(!run||run.qs[run.i]!==q) return;  // quiz closed or moved on while marking
    const v=VERDICT[r&&r.verdict]; if(!v||typeof r.feedback!=='string') throw {code:'invalid_json'};
    run.grading=false; run.picked=0;
    record(q,v.credit);
    saveDefinition(n,text,r.verdict,r.feedback);
    document.getElementById('qScore').textContent='Score '+num(run.score);
    const last=run.i===run.qs.length-1;
    after.innerHTML=`<div class="verdict ${v.cls}"><b>${v.label}</b><p>${esc(r.feedback)}</p>${r.missing?`<p><b style="font:inherit;color:inherit;letter-spacing:0;text-transform:none;font-weight:600">Key point:</b> ${esc(r.missing)}</p>`:''}<p class="ref">The card says: ${esc(n.def)}</p></div>
      <div class="qactions"><button class="go" data-act="next">${last?'See results':'Next question'}</button><button class="ghost" data-open="${n.id}">Open card</button></div>`;
    quizCard.querySelector('[data-act="next"]').focus();
  }catch(e){
    if(!run||run.qs[run.i]!==q) return;
    run.grading=false; box.disabled=false; acts.hidden=false;
    if(e&&(e.code==='not_granted'||e.code==='sampling_disabled')) sample=null;
    const msg=e&&e.code==='invalid_json'?'Claude’s marking came back in an unexpected form.':(ERR[e&&e.code]||ERR.upstream_error);
    after.innerHTML=`<p class="intro">${esc(msg)} ${sample?'Check your answer again, or skip this question.':'You can skip this question.'}</p>`;
  }
}
// Keep each concept's last few written definitions, so progress shows in the learner's own words.
function saveDefinition(n,answer,verdict,feedback){
  const defs=quizData.defs||(quizData.defs={});
  defs[n.id]=(defs[n.id]||[]).concat({at:Date.now(),answer:answer.slice(0,2000),verdict,feedback}).slice(-10);
  store.set('quiz',quizData);
}
function finishRun(){
  if(!run||run.done) return null;
  run.done=true; if(!run.answered) return null;
  const prev=quizData.attempts.filter(a=>a.scope===run.scope).map(a=>pct(a.score,a.total));
  quizData.attempts.push({at:Date.now(),scope:run.scope,score:run.score,total:run.answered});
  if(quizData.attempts.length>300) quizData.attempts.splice(0,quizData.attempts.length-300);
  store.set('quiz',quizData);
  return prev.length?Math.max(...prev):null;
}
function renderResults(best){
  const p=pct(run.score,run.answered), name=scopeName(run.scope);
  const msg=p===100?'Perfect score.':p>=80?'Strong work.':p>=50?'Solid progress. Revisit the ones you missed.':'Keep going. The cards below are worth another read.';
  const vs=best===null?`Your first quiz on ${name}.`:p>best?`A new best on ${name}, up from ${best}%.`:`Your best on ${name} is ${best}%.`;
  const missed=[...new Set(run.missed)];
  quizCard.innerHTML=quizHead('Results')+`
    <div class="big">${num(run.score)}/${run.answered}</div>
    <p class="intro">${msg} ${esc(vs)}</p>
    ${missed.length?`<div class="eyebrow">Missed this round</div><ul class="weak">${missed.map(n=>`<li><button data-open="${n.id}">${esc(n.name)}<span>Open card</span></button></li>`).join('')}</ul>`:''}
    <div class="qactions"><button class="go" data-act="again">Another round</button><button class="ghost" data-act="home">See progress</button></div>`;
  quizCard.querySelector('[data-act="again"]').focus();
}
function nextQuestion(){
  run.i++; run.picked=null;
  if(run.i<run.qs.length) return renderQuestion();
  renderResults(finishRun());
}
quizCard.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const act=b.dataset.act;
  if(act==='close') return closeQuiz();
  if(b.dataset.scope){qScope=b.dataset.scope;quizCard.querySelectorAll('[data-scope]').forEach(x=>x.setAttribute('aria-pressed',x===b));return;}
  if(b.dataset.len){qLen=+b.dataset.len;quizCard.querySelectorAll('[data-len]').forEach(x=>x.setAttribute('aria-pressed',x===b));return;}
  if(act==='start'||act==='again') return startRun();
  if(b.dataset.opt!==undefined) return answer(+b.dataset.opt);
  if(act==='next') return nextQuestion();
  if(act==='grade') return gradeDefinition();
  if(act==='skip') return nextQuestion();  // skipped questions don't count either way
  if(act==='home') return renderQuizHome();
  if(b.dataset.open){const n=byId[b.dataset.open];closeQuiz();select(n);}
});
quizEl.addEventListener('click',ev=>{if(ev.target===quizEl)closeQuiz();});
quizEl.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ev.preventDefault();closeQuiz();return;}
  if(ev.target.tagName==='TEXTAREA'){
    if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();gradeDefinition();}
    return;
  }
  const d=+ev.key, q=run&&run.qs[run.i];
  if(q&&q.options&&run.picked===null&&d>=1&&d<=4) answer(d-1);
});
quizBtn.onclick=openQuiz;

renderIntro();
</script>
