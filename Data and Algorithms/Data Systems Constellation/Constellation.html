<title>Data Systems Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed orbiting star chart; title block top-left, reading panel docked right (bottom sheet on phones). Single dark observatory look by design. */
:root{
  color-scheme: dark;
  --ink:#080b14;          /* night ground */
  --ink-2:#0e1322;        /* panel */
  --line:#232a40;         /* hairlines */
  --ivory:#ece6d8;        /* primary text */
  --mist:#9198ad;         /* secondary text */
  --halo:#f4dfa8;         /* focus accent */
  --good:#8fd6a0;         /* quiz: correct */
  --bad:#f28b7d;          /* quiz: incorrect */
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--ivory);font-family:var(--f-body);overflow:hidden;font-size:14px}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#sky.dragging{cursor:grabbing}
#sky.pointing{cursor:pointer}

.masthead{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:20px;max-width:min(440px, calc(100% - 40px));pointer-events:none;display:grid;gap:6px}
.masthead h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.2vw,44px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.masthead h1 em{color:var(--halo)}
.meta{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);font-variant-numeric:tabular-nums}

.search{position:relative;pointer-events:auto;margin-top:10px;width:min(280px,100%)}
.search input{width:100%;box-sizing:border-box;background:color-mix(in srgb,var(--ink-2) 85%,transparent);border:1px solid var(--line);color:var(--ivory);font:13px var(--f-mono);padding:9px 12px;border-radius:2px;outline:none;backdrop-filter:blur(6px)}
.search input:focus-visible{border-color:var(--halo)}
.search input::placeholder{color:var(--mist)}
.results{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px 0;list-style:none;background:var(--ink-2);border:1px solid var(--line);z-index:5}
.results button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:7px 12px;font:13px var(--f-mono);cursor:pointer;color:var(--ivory)}
.results button:hover,.results button:focus-visible,.results button.active{background:var(--line)}

.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:370px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--ink-2) 88%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px);overflow:hidden}
.panel-scroll{flex:1;min-height:0;overflow-y:auto;padding:22px 22px 26px;display:grid;gap:18px;align-content:start}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;background:currentColor}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.05;text-wrap:balance}
.def{margin:0;font-size:14.5px;line-height:1.55;color:var(--ivory)}
.intro{margin:0;font-size:13.5px;line-height:1.6;color:var(--mist)}
.intro b{color:var(--ivory);font-weight:500}
.links{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.links button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:8px 1fr;gap:4px 10px;align-items:baseline;width:100%;padding:10px 10px;cursor:pointer;border-left:1px solid var(--line)}
.links button:hover,.links button:focus-visible{background:color-mix(in srgb,var(--line) 70%,transparent);border-left-color:var(--halo)}
.links .dot{width:6px;height:6px;align-self:center}
.links .nm{font:500 13px var(--f-mono);color:var(--ivory)}
.links .rel{grid-column:2;font-size:12.5px;line-height:1.45;color:var(--mist)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.legend button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;cursor:pointer;font:13px var(--f-mono);color:var(--ivory)}
.legend button .ct{margin-left:auto;color:var(--mist);font-variant-numeric:tabular-nums}
.legend button:hover,.legend button:focus-visible{background:var(--line)}
.legend button[aria-pressed="true"]{background:var(--line);outline:1px solid var(--halo);outline-offset:-1px}
.close{all:unset;cursor:pointer;font:11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mist);padding:4px 0;justify-self:start}
.close:hover,.close:focus-visible{color:var(--halo)}
.facet{display:grid;gap:7px}
.facet p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ivory)}
.facet.example p{font-size:13px;color:var(--ivory);background:color-mix(in srgb,var(--ink) 70%,transparent);border:1px solid var(--line);padding:11px 13px}
.facet.example code{font-family:var(--f-mono);font-size:12px;color:var(--halo)}
.facet.analogy p{font-family:var(--f-display);font-style:italic;font-size:19px;line-height:1.35;color:var(--halo)}
.facet.why p{padding-left:12px;border-left:1px solid var(--line);color:var(--ivory)}
.more{font-family:var(--f-mono);font-size:11px;color:var(--mist);letter-spacing:.04em}
.members{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.members button{all:unset;cursor:pointer;font:12px var(--f-mono);padding:5px 9px;border:1px solid var(--line);color:var(--ivory)}
.members button:hover,.members button:focus-visible{border-color:var(--halo);color:var(--halo)}
.chat{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.chat-head{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:4px 0}
.chat-head .eyebrow{flex:1}
.chat-head .chev{font:10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mist);display:flex;align-items:center;gap:6px}
.chat-head .chev::after{content:"";width:6px;height:6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
.chat-head[aria-expanded="false"] .chev::after{transform:rotate(-45deg)}
.chat-head:hover .chev,.chat-head:focus-visible .chev{color:var(--halo)}
.chat-head:focus-visible{outline:1px solid var(--halo);outline-offset:4px}
.qa-list{display:grid;border-top:1px solid var(--line)}
.qa{border-bottom:1px solid var(--line)}
.qa summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr);gap:4px 10px;padding:10px 0;align-items:baseline}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"";width:5px;height:5px;border-right:1px solid var(--mist);border-bottom:1px solid var(--mist);transform:rotate(-45deg);transition:transform .2s;align-self:center}
.qa[open] summary::before{transform:rotate(45deg);border-color:var(--halo)}
.qa summary:focus-visible{outline:1px solid var(--halo);outline-offset:2px}
.qa .q{font:12.5px/1.5 var(--f-mono);color:var(--ivory);overflow-wrap:anywhere}
.qa:not([open]) .q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qa[open] .q{color:var(--halo)}
.qa .when{grid-column:2;font:10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.qa .answer{padding:0 0 14px 20px;font-size:13.5px;line-height:1.6;color:var(--ivory);overflow-wrap:anywhere;min-width:0}
.qa .answer p{margin:0 0 8px}.qa .answer p:last-child{margin:0}
.qa .answer ul{margin:0 0 8px;padding-left:18px}.qa .answer li{margin:2px 0}
.qa .answer code{font-family:var(--f-mono);font-size:12px;color:var(--halo)}
.qa .answer b{font-weight:600}
.qa .thinking{color:var(--mist);font-style:italic}
.empty-chat{margin:0;font-size:13px;line-height:1.55;color:var(--mist)}
.starters{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.starters button{all:unset;cursor:pointer;font:12px var(--f-body);padding:5px 9px;border:1px dashed var(--line);color:var(--mist)}
.starters button:hover,.starters button:focus-visible{border-color:var(--halo);color:var(--halo)}
.composer{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:8px;background:color-mix(in srgb,var(--ink) 55%,transparent)}
.composer textarea{width:100%;box-sizing:border-box;resize:none;min-height:42px;max-height:140px;background:var(--ink);border:1px solid var(--line);color:var(--ivory);font:13px/1.5 var(--f-body);padding:9px 11px;border-radius:0;outline:none}
.composer textarea:focus-visible{border-color:var(--halo)}
.composer textarea::placeholder{color:var(--mist)}
.composer .row{display:flex;align-items:center;gap:10px}
.composer .status{flex:1;min-width:0;font:11px var(--f-mono);color:var(--mist)}
.composer button{all:unset;cursor:pointer;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;background:var(--halo);color:var(--ink)}
.composer button:disabled{opacity:.4;cursor:default}
.composer button.stop{background:transparent;color:var(--ivory);outline:1px solid var(--line)}
.composer button:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}
.quiz-open{all:unset;justify-self:start;pointer-events:auto;cursor:pointer;margin-top:2px;padding:2px 0;font:11px var(--f-mono);letter-spacing:.06em;color:var(--mist);border-bottom:1px dotted color-mix(in srgb,var(--mist) 60%,transparent)}
.quiz-open:hover,.quiz-open:focus-visible{color:var(--halo);border-bottom-color:var(--halo)}
.quiz{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--ink) 72%,transparent);backdrop-filter:blur(6px)}
.quiz-card{width:min(600px,100%);max-height:calc(100% - 8px);overflow-y:auto;box-sizing:border-box;background:var(--ink-2);border:1px solid var(--line);padding:24px 26px 26px;display:grid;gap:18px;align-content:start;box-shadow:0 20px 80px rgba(0,0,0,.55)}
.quiz-head{display:flex;align-items:baseline;gap:12px}
.quiz-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.quiz-head .x{all:unset;cursor:pointer;margin-left:auto;font:11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.quiz-head .x:hover,.quiz-head .x:focus-visible{color:var(--halo)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font:12px var(--f-mono);padding:6px 10px;border:1px solid var(--line);color:var(--ivory)}
.chips button[aria-pressed="true"]{border-color:var(--halo);background:color-mix(in srgb,var(--halo) 12%,transparent);color:var(--halo)}
.chips button:hover,.chips button:focus-visible{border-color:var(--halo)}
.chips .dot{width:6px;height:6px}
.go{all:unset;cursor:pointer;justify-self:start;padding:11px 20px;background:var(--halo);color:var(--ink);font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.go:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}
.qmeta{display:flex;justify-content:space-between;gap:10px;font:11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mist);font-variant-numeric:tabular-nums}
.qbar{height:2px;background:var(--line)}.qbar i{display:block;height:100%;background:var(--halo);transition:width .3s}
.qkind{font:11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.qtext{margin:0;font-size:16px;line-height:1.6;color:var(--ivory)}
.qtext.analogy{font-family:var(--f-display);font-style:italic;font-size:22px;line-height:1.35;color:var(--halo)}
.qtext mark{background:none;color:var(--halo);font-family:var(--f-mono);font-size:.85em;letter-spacing:.05em}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opts button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);font:13.5px var(--f-body);color:var(--ivory)}
.opts button .k{font:11px var(--f-mono);color:var(--mist);width:14px}
.opts button:hover:not(:disabled),.opts button:focus-visible{border-color:var(--halo)}
.opts button:disabled{cursor:default}
.opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.verdict{display:grid;gap:6px;padding:12px 14px;border-left:2px solid var(--good)}
.verdict.miss{border-left-color:var(--bad)}
.verdict b{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--good)}
.verdict.miss b{color:var(--bad)}
.verdict p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ivory)}
.defbox{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;background:var(--ink);border:1px solid var(--line);color:var(--ivory);font:14px/1.6 var(--f-body);padding:12px 14px;outline:none;border-radius:0}
.defbox:focus-visible{border-color:var(--halo)}
.defbox:disabled{opacity:.75}
.defhint{margin:-8px 0 0;font-size:12.5px;line-height:1.5;color:var(--mist)}
.marking{margin:0;font:12px var(--f-mono);color:var(--mist);letter-spacing:.04em}
.marking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.marking::after{animation:none;content:"…"}}
.verdict.partly{border-left-color:var(--halo)}
.verdict.partly b{color:var(--halo)}
.verdict .ref{color:var(--mist);font-size:12.5px}
.qactions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ghost{all:unset;cursor:pointer;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mist);padding:8px 0}
.ghost:hover,.ghost:focus-visible{color:var(--halo)}
.big{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--halo);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stats div{background:var(--ink-2);padding:10px 12px;display:grid;gap:2px}
.stats b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font:10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.mastery{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.mastery li{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:10px;align-items:center;font:12px var(--f-mono);color:var(--ivory)}
.mastery .track{height:6px;background:var(--line)}.mastery .track i{display:block;height:100%}
.mastery .pc{text-align:right;color:var(--mist);font-variant-numeric:tabular-nums}
.history{display:flex;align-items:flex-end;gap:4px;height:56px;border-bottom:1px solid var(--line)}
.history i{flex:1;max-width:22px;background:var(--halo);opacity:.85;min-height:2px}
.weak{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.weak button{all:unset;cursor:pointer;display:flex;gap:10px;width:100%;box-sizing:border-box;padding:6px 0;font:12.5px var(--f-mono);color:var(--ivory)}
.weak button span{margin-left:auto;color:var(--mist);font-variant-numeric:tabular-nums}
.weak button:hover,.weak button:focus-visible{color:var(--halo)}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--mist);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
.hint kbd{font:inherit;color:var(--ivory)}

#tip{position:fixed;left:0;top:0;max-width:280px;pointer-events:none;background:var(--ink-2);border:1px solid var(--halo);padding:11px 13px 12px;display:grid;gap:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:10}
#tip .pair{font:500 11.5px var(--f-mono);letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:4px 7px;align-items:center}
#tip .pair i{font-style:normal;color:var(--mist)}
#tip p{margin:0;font-size:13px;line-height:1.5;color:var(--ivory)}

.zoom{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;border:1px solid var(--line);background:color-mix(in srgb,var(--ink-2) 88%,transparent);backdrop-filter:blur(6px)}
.zoom button{all:unset;box-sizing:border-box;min-width:40px;height:40px;padding:0 12px;display:grid;place-items:center;cursor:pointer;font:15px var(--f-mono);color:var(--ivory)}
.zoom button+button{border-left:1px solid var(--line)}
.zoom button#zreset{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.zoom button:hover,.zoom button:focus-visible{background:var(--line);color:var(--halo)}

@media (max-width:820px){
  .zoom{left:auto;right:16px;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .zoom #zreset{display:none}
  .panel{top:auto;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:auto;max-height:42%}
  .panel-scroll{padding:16px 18px 20px;gap:14px}
  .panel h2{font-size:26px}
  .masthead{left:16px;top:calc(env(safe-area-inset-top,0px) + 16px);max-width:calc(100% - 32px)}
  .hint{display:none}
}
</style>

<canvas id="sky" aria-label="3D network of 80 data-systems concepts"></canvas>

<header class="masthead">
  <h1>Data Systems <em>Constellation</em></h1>
  <div class="meta" id="meta"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Find a concept…" autocomplete="off" aria-label="Find a concept">
    <ul class="results" id="results" hidden></ul>
  </div>
  <button class="quiz-open" id="quizBtn" type="button">Take a pop quiz →</button>
</header>

<aside class="panel"><div class="panel-scroll" id="panel" aria-live="polite"></div>
  <form class="composer" id="composer" hidden>
    <label for="askBox" class="eyebrow">Ask Claude about this card</label>
    <textarea id="askBox" rows="2" placeholder="Ask a question…"></textarea>
    <div class="row"><span class="status" id="askStatus"></span><button type="button" class="stop" id="stopBtn" hidden>Stop</button><button type="submit" id="askBtn">Ask</button></div>
  </form>
</aside>
<div class="zoom" role="group" aria-label="Zoom">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zreset">Reset view</button>
</div>
<div id="tip" hidden></div>
<div class="quiz" id="quiz" role="dialog" aria-modal="true" aria-labelledby="quizTitle" hidden><div class="quiz-card" id="quizCard"></div></div>

<script>
/*DATA*/
const CLUSTERS = {
  storage:  {name:"Storage engines",          color:"#e7b660"},
  txn:      {name:"Transactions & isolation", color:"#f08a7c"},
  consensus:{name:"Consensus & coordination", color:"#ab9bf6"},
  repl:     {name:"Replication & consistency",color:"#63b9ea"},
  part:     {name:"Partitioning & scale",     color:"#7ed3a8"},
  traffic:  {name:"Traffic & resilience",     color:"#cfd86c"},
  model:    {name:"Modeling & querying",      color:"#ea8fca"}
};
// about = what the region covers · why = where it shows up in day-to-day engineering
const REGIONS = {
  storage:{about:"How a single database physically lays data out on disk and memory: the index structures, logs and maintenance jobs underneath every query. Each engine trades read speed, write speed and space against one another.",
   why:["Choosing a database is choosing a storage engine. Postgres (B-tree) and Cassandra (LSM) behave very differently under write-heavy load.",
        "Slow queries, table bloat and disk filling up are usually storage problems: a missing index, autovacuum falling behind, or WAL piling up.",
        "Backups and point-in-time recovery decide whether a bad migration costs you minutes or a week of data."]},
  txn:{about:"What happens when many requests touch the same data at once. Isolation levels, anomalies and locking strategies decide which interleavings your code can ever observe.",
   why:["Most race-condition bugs in web apps are isolation anomalies: double bookings, oversold stock, negative balances.",
        "Your database’s default isolation level is probably weaker than you assume (READ COMMITTED in Postgres).",
        "Picking optimistic or pessimistic locking shapes your API: retries and 409 responses, or waiting and deadlocks."]},
  consensus:{about:"Getting machines that can crash, pause or lose messages to agree: on a leader, on a commit, on who holds a lock. These are the hardest correctness problems in distributed systems.",
   why:["Any workflow that spans two services (charge the card, then reserve stock) faces these problems whether you name them or not.",
        "Retries are unavoidable over a network, so idempotency keys are a basic API-design skill.",
        "Kubernetes, Kafka and most managed databases run on Raft-style consensus; knowing it explains their failure modes."]},
  repl:{about:"Keeping copies of data on several machines for availability, read scale and locality, and deciding what readers may see while those copies disagree.",
   why:["Read replicas and failover are standard in every managed database, and so is replica lag, the cause of ‘I saved it but it vanished’ bugs.",
        "CAP and consistency models tell you what a vendor’s guarantees actually mean during an outage.",
        "CDC is how data leaves the primary database to reach search, caches, analytics and other services."]},
  part:{about:"Splitting data and load across machines once one is no longer enough. The partitioning scheme decides how evenly load spreads, which queries stay cheap, and how painful growth becomes.",
   why:["Shard keys are close to irreversible. A poor choice means hot partitions and a painful migration later.",
        "DynamoDB, Cassandra, Kafka and Elasticsearch all ask you to choose partition keys up front.",
        "Skew is behind most ‘one node at 100%, the rest idle’ incidents."]},
  traffic:{about:"Controlling how requests flow between services so that one slow component degrades gracefully instead of taking everything down with it.",
   why:["Most large outages are cascading failures: retries, herds and exhausted pools, not the original fault.",
        "Timeouts, backoff and circuit breakers are decisions you make in every client you write.",
        "Connection pool sizing is one of the most common production misconfigurations."]},
  model:{about:"How data is shaped for its readers and writers: normalized for integrity, denormalized or projected for speed, and evolved safely over time. The query planner turns those shapes into actual work.",
   why:["Schema design decides which features will be easy or hard to build for years afterwards.",
        "Reading EXPLAIN output is the fastest way to fix a slow endpoint.",
        "Every schema change in production must stay compatible with code that is still running the old version."]}
