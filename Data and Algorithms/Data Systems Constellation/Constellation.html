<style>
/* Layout: full-bleed orbiting star chart; title block top-left, reading panel docked right (bottom sheet on phones). Single dark observatory look by design. */
:root{
  color-scheme: dark;
  --ink:#080b14;          /* night ground */
  --ink-2:#0e1322;        /* panel */
  --line:#232a40;         /* hairlines */
  --ivory:#ece6d8;        /* primary text */
  --mist:#9198ad;         /* secondary text */
  --halo:#f4dfa8;         /* focus accent */
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--ivory);font-family:var(--f-body);overflow:hidden;font-size:14px}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#sky.dragging{cursor:grabbing}
#sky.pointing{cursor:pointer}

.masthead{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:20px;max-width:min(440px, calc(100% - 40px));pointer-events:none;display:grid;gap:6px}
.masthead h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.2vw,44px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.masthead h1 em{color:var(--halo)}
.meta{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);font-variant-numeric:tabular-nums}

.search{position:relative;pointer-events:auto;margin-top:10px;width:min(280px,100%)}
.search input{width:100%;box-sizing:border-box;background:color-mix(in srgb,var(--ink-2) 85%,transparent);border:1px solid var(--line);color:var(--ivory);font:13px var(--f-mono);padding:9px 12px;border-radius:2px;outline:none;backdrop-filter:blur(6px)}
.search input:focus-visible{border-color:var(--halo)}
.search input::placeholder{color:var(--mist)}
.results{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px 0;list-style:none;background:var(--ink-2);border:1px solid var(--line);z-index:5}
.results button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:7px 12px;font:13px var(--f-mono);cursor:pointer;color:var(--ivory)}
.results button:hover,.results button:focus-visible,.results button.active{background:var(--line)}

.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:330px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--ink-2) 88%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px);overflow:hidden}
.panel-scroll{overflow-y:auto;padding:22px 22px 26px;display:grid;gap:18px;align-content:start}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;background:currentColor}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.05;text-wrap:balance}
.def{margin:0;font-size:14.5px;line-height:1.55;color:var(--ivory)}
.intro{margin:0;font-size:13.5px;line-height:1.6;color:var(--mist)}
.intro b{color:var(--ivory);font-weight:500}
.links{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.links button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:8px 1fr;gap:4px 10px;align-items:baseline;width:100%;padding:10px 10px;cursor:pointer;border-left:1px solid var(--line)}
.links button:hover,.links button:focus-visible{background:color-mix(in srgb,var(--line) 70%,transparent);border-left-color:var(--halo)}
.links .dot{width:6px;height:6px;align-self:center}
.links .nm{font:500 13px var(--f-mono);color:var(--ivory)}
.links .rel{grid-column:2;font-size:12.5px;line-height:1.45;color:var(--mist)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.legend button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;cursor:pointer;font:13px var(--f-mono);color:var(--ivory)}
.legend button .ct{margin-left:auto;color:var(--mist);font-variant-numeric:tabular-nums}
.legend button:hover,.legend button:focus-visible{background:var(--line)}
.legend button[aria-pressed="true"]{background:var(--line);outline:1px solid var(--halo);outline-offset:-1px}
.close{all:unset;cursor:pointer;font:11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mist);padding:4px 0;justify-self:start}
.close:hover,.close:focus-visible{color:var(--halo)}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--mist);line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
.hint kbd{font:inherit;color:var(--ivory)}

#tip{position:fixed;left:0;top:0;max-width:280px;pointer-events:none;background:var(--ink-2);border:1px solid var(--halo);padding:11px 13px 12px;display:grid;gap:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:10}
#tip .pair{font:500 11.5px var(--f-mono);letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:4px 7px;align-items:center}
#tip .pair i{font-style:normal;color:var(--mist)}
#tip p{margin:0;font-size:13px;line-height:1.5;color:var(--ivory)}

@media (max-width:820px){
  .panel{top:auto;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:auto;max-height:42%}
  .panel-scroll{padding:16px 18px 20px;gap:14px}
  .panel h2{font-size:26px}
  .masthead{left:16px;top:calc(env(safe-area-inset-top,0px) + 16px);max-width:calc(100% - 32px)}
  .hint{display:none}
}

const byId = {}; const nodes = NODES.map(([id,name,cl,def],i)=>{const n={id,name,cl,def,i,links:[]};byId[id]=n;return n;});
const edges = EDGES.map(([a,b,rel],i)=>{const e={a:byId[a],b:byId[b],rel,i};e.a.links.push(e);e.b.links.push(e);return e;});
document.getElementById('meta').textContent = `${nodes.length} concepts · ${edges.length} relations`;

/* ---------- 3D force layout (seeded, computed once) ---------- */
let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)-1)/2147483646;
const clusterKeys=Object.keys(CLUSTERS), R=270;
const centers={}; clusterKeys.forEach((k,i)=>{const y=1-(i+.5)/clusterKeys.length*2, r=Math.sqrt(1-y*y), t=i*2.39996;centers[k]=[Math.cos(t)*r*R*.72,y*R*.72,Math.sin(t)*r*R*.72];});
nodes.forEach(n=>{const c=centers[n.cl];n.x=c[0]+(rnd()-.5)*90;n.y=c[1]+(rnd()-.5)*90;n.z=c[2]+(rnd()-.5)*90;n.vx=n.vy=n.vz=0;});
for(let it=0;it<420;it++){
  const cool=1-it/420;
  for(let i=0;i<nodes.length;i++){const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
      let dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z,d2=dx*dx+dy*dy+dz*dz+.01;const f=2600/d2,d=Math.sqrt(d2);
      dx/=d;dy/=d;dz/=d;a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f;b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f;}}
  edges.forEach(e=>{const a=e.a,b=e.b;let dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,d=Math.hypot(dx,dy,dz)||1;const f=(d-95)*.02;
    dx/=d;dy/=d;dz/=d;a.vx+=dx*f;a.vy+=dy*f;a.vz+=dz*f;b.vx-=dx*f;b.vy-=dy*f;b.vz-=dz*f;});
  nodes.forEach(n=>{const c=centers[n.cl];n.vx+=(c[0]-n.x)*.012-n.x*.004;n.vy+=(c[1]-n.y)*.012-n.y*.004;n.vz+=(c[2]-n.z)*.012-n.z*.004;
    const m=Math.min(1,Math.hypot(n.vx,n.vy,n.vz))*0+1; n.x+=n.vx*.5*cool*m;n.y+=n.vy*.5*cool;n.z+=n.vz*.5*cool;n.vx*=.6;n.vy*=.6;n.vz*=.6;});
}
// recentre and normalise radius
{let mx=0,my=0,mz=0;nodes.forEach(n=>{mx+=n.x;my+=n.y;mz+=n.z});mx/=nodes.length;my/=nodes.length;mz/=nodes.length;
 let rmax=0;nodes.forEach(n=>{n.x-=mx;n.y-=my;n.z-=mz;rmax=Math.max(rmax,Math.hypot(n.x,n.y,n.z))});const k=R/rmax;nodes.forEach(n=>{n.x*=k;n.y*=k;n.z*=k});}
